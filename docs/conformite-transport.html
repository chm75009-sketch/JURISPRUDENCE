<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16181d">
<link rel="icon" href="icons/icon-discipline-180.png">
<title>Suivi tachygraphe</title>
<link rel="stylesheet" href="style.css">
<script src="barre.js"></script>

<!--
  LE MODULE CONFORMITÉ TRANSPORT ET CONTRÔLE DRIEAT.

  Deux espaces. La prévention : les documents que l'entreprise tient au jour le
  jour (consigne signée, journal de téléchargement, registre des anomalies,
  compte rendu de contrôle), et l'échéancier des téléchargements, calculé par
  véhicule depuis la flotte et par conducteur depuis le registre. La défense :
  le rétroplanning des délais de la commission, la note de méthode et la liste
  des moyens, prêts le jour du contrôle.

  Rien ne se saisit deux fois : les véhicules viennent de flotte-vehicules, les
  conducteurs de registre-personnel. Le moteur et les textes vérifiés sont dans
  conformite-transport.js.
-->

<style>
  /* Les cartes et les filets de cette page : la feuille commune les nomme
     surface et filet. Sans ces deux lignes, les cartes n'avaient ni fond ni bord. */
  :root{--fond-2:var(--surface);--trait:var(--filet)}
  .enveloppe{max-width:820px;margin:0 auto;padding:0 16px}
  h1.titre{font:600 clamp(22px,3.4vw,30px)/1.3 system-ui;margin:var(--e5) 0 4px}
  .sous{color:var(--texte-2);margin:0 0 var(--e5)}
  .espace{margin:var(--e6) 0}
  .espace>h2{font-size:var(--t5);border-bottom:1.5px solid var(--trait);padding-bottom:6px;margin:0 0 var(--e3)}
  details.repli>summary{font:600 var(--t5)/1.3 system-ui;border-bottom:1.5px solid var(--trait);padding-bottom:6px;margin:0 0 var(--e3);cursor:pointer;list-style:none;color:var(--texte-2)}
  details.repli>summary::-webkit-details-marker{display:none}
  details.repli>summary::after{content:" +";color:var(--texte-2);font-weight:400}
  details.repli[open]>summary::after{content:" -"}
  .carte{border:1px solid var(--trait);border-radius:10px;padding:14px 16px;margin:0 0 var(--e3);background:var(--fond-2)}
  .carte h3{margin:0 0 2px;font-size:var(--t4)}
  .carte .sous3{color:var(--texte-2);font-size:var(--t2);margin:0 0 8px}
  .carte button{font-size:15px;padding:9px 16px}
  .doc{display:none;margin:10px 0 0;padding:12px 0 0;border-top:1px dashed var(--trait)}
  .doc.ouvert{display:block}
  .doc h4{margin:12px 0 4px}
  .doc .bloc-h1{font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin:4px 0 8px}
  .doc .bloc-h2{font-weight:700;margin:10px 0 2px}
  .doc .bloc-note{color:var(--texte-2);font-style:italic;font-size:var(--t2)}
  .doc .bloc-table{font-family:ui-monospace,monospace;font-size:13px;background:var(--fond);padding:8px;border-radius:6px;white-space:pre-wrap}
  .doc .volet{margin:10px 0 0}
  .doc .volet b{display:block;margin:0 0 2px}
  .doc ul{margin:4px 0 0;padding-left:20px}
  table.ech{width:100%;border-collapse:collapse;margin:8px 0 0;font-size:14px}
  table.ech th,table.ech td{border:1px solid var(--trait);padding:6px 8px;text-align:left;vertical-align:top}
  table.ech th{background:var(--fond-2)}
  .pastille{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
  .f-vert{background:#1f6f43;color:#fff}.f-orange{background:#9a5b16;color:#fff}
  .f-rouge{background:#8a2020;color:#fff}.f-gris{background:#555;color:#fff}
  table.ech input{width:140px}
  .nontransport{border:1px solid var(--trait);border-radius:10px;padding:16px;color:var(--texte-2)}
  .retro td input{width:160px}
  /* le look de la fiche : bascules segmentées et lignes de documents */
  .ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--trait)}
  .ctl .lb{font-weight:600;font-size:14px}
  .seg{display:inline-flex;border:1px solid var(--trait);border-radius:9px;overflow:hidden;background:var(--fond)}
  .seg button{font:600 13px system-ui;border:0;background:transparent;color:var(--texte-2);padding:7px 14px;cursor:pointer;margin:0}
  .seg button.on{background:var(--accent);color:#fff}
  .fitem{padding:11px 0;border-top:1px solid var(--trait)}
  .fitem .ti b{font-size:15px;display:block}
  .fitem .ti span{color:var(--texte-2);font-size:13px}
  .fitem .co{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .fitem .co .lab{font-size:12px;color:var(--texte-2)}
  .fitem .co input[type=date]{font-size:14px;padding:7px 9px}
  .fitem .co button{margin:0;font-size:14px;padding:8px 14px}
  .pick{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .chip-cond{font:600 14px system-ui;border:1px solid var(--trait);background:var(--fond-2);color:var(--texte);border-radius:20px;padding:8px 14px;cursor:pointer;margin:0}
  .chip-cond.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chip-cond::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle;background:#777}
  .chip-cond.f-rouge::before{background:#8a2020}.chip-cond.f-orange::before{background:#9a5b16}.chip-cond.f-vert::before{background:#1f6f43}
  .chip-cond.on::before{background:#fff}
  .choixcond{margin:0 0 14px}
  .choixcond label{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:5px}
  .choixcond select{font-size:16px;padding:10px;border:1px solid var(--trait);border-radius:9px;background:var(--fond-2);color:var(--texte)}
  .cond h3{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .cond .pl{font-size:11px;background:var(--fond);border:1px solid var(--trait);border-radius:10px;padding:1px 8px;color:var(--texte-2)}
  .mini{margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
  .mini label{display:flex;flex-direction:column;font-size:12px;color:var(--texte-2);gap:2px}
  .mini input,.mini select{font-size:14px;padding:7px 8px}
  .mini input[type=text]{min-width:120px}
  .mini button{font-size:14px;padding:8px 12px}
  .sup{background:none;border:none;color:var(--texte-2);cursor:pointer;font-size:16px;padding:0 4px}
  .vide{color:var(--texte-2);font-style:italic;font-size:var(--t2);margin:6px 0 0}
  .echeance{border:1px solid var(--trait);border-left:4px solid var(--trait);border-radius:10px;padding:12px 14px;margin:0 0 10px;background:var(--fond-2)}
  .echeance.b-vert{border-left-color:#1f6f43}.echeance.b-orange{border-left-color:#9a5b16}
  .echeance.b-rouge{border-left-color:#8a2020}.echeance.b-gris{border-left-color:#777}
  .echeance .et-titre{font-weight:600;margin:0 0 8px}
  .echeance .et-ligne{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;margin:6px 0}
  .echeance .et-ligne>span.lab{color:var(--texte-2);font-size:var(--t2)}
  .echeance input[type=date]{font-size:15px;padding:7px 8px}
  .echeance input[type=file]{max-width:100%;font-size:13px}
  /* ── le suivi tachygraphe du conducteur, en quatre étapes ── */
  .st{margin:0 0 var(--e3)}
  .st-entete{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:0 0 10px}
  .st-essai{border:2px dashed #9a6400;background:#fef6e6;color:#4d3300;border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:14px;line-height:1.4}
  .st-essai b{display:block;font-size:15px;margin:0 0 2px}
  .st-essai .st-btn{font:500 15px/1.2 system-ui;cursor:pointer;border-radius:9px;border:1px solid var(--filet-2);background:var(--surface);color:var(--texte);padding:10px 14px;min-height:44px;margin:0}
  .st-essai .st-btn.pri{background:#9a6400;border-color:#9a6400;color:#fff;font-weight:600}
  .st-essai .st-btn.pri:hover{background:#7a4f00;border-color:#7a4f00}
  .choixcond .st-lien{display:inline-block;background:none;border:0;min-height:0;color:var(--accent);font:400 14px/1.3 system-ui;padding:8px 0 0;margin:0;cursor:pointer;text-decoration:underline}
  .choixcond .st-lien:hover{background:none;color:var(--accent-fonce)}
  .st-nom{font-weight:600;font-size:17px}.st-nom2{font-weight:600;font-size:15px}
  .st-pl{font-size:11px;font-weight:400;background:var(--fond);border:1px solid var(--trait);border-radius:10px;padding:1px 8px;color:var(--texte-2)}
  .st-sub{font-size:13px;color:var(--texte-2);margin-top:3px}
  .st-h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--texte-2);margin:4px 0 8px;font-weight:700;border:0;padding:0}
  .st button,.st-ovl button{margin:0;min-height:0;max-width:none}
  .st label,.st-ovl label{color:inherit}
  .st input,.st select,.st-ovl input,.st-ovl select{min-height:0}
  .st .st-bandeau{display:block;width:100%;text-align:left;font:400 14.5px/1.4 system-ui;border:0;border-left:5px solid #b4231f;background:#fdecea;color:#7a1512;border-radius:0 10px 10px 0;padding:10px 12px;margin:0 0 8px;cursor:pointer}
  .st-bandeau b{display:block}
  .st .st-bandeau.orange{border-left-color:#9a6400;background:#fef6e6;color:#7a4f00}
  .st .st-bandeau:hover{filter:brightness(.97)}
  .st-etapes{display:flex;gap:6px;margin:6px 0 14px}
  .st .st-etapes button{position:relative;flex:1;min-width:0;background:var(--surface);border:1px solid var(--filet);border-radius:12px;padding:8px 2px;cursor:pointer;color:var(--texte);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;font:400 12px/1.2 system-ui}
  .st-etapes .num{width:26px;height:26px;border-radius:999px;background:var(--fond);color:var(--texte-2);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1px solid var(--trait)}
  .st-etapes .num.ok{background:#1f7a3d;color:#fff;border-color:#1f7a3d}
  .st-etapes .lb{font-size:11px;line-height:1.15;text-align:center;color:var(--texte-2)}
  .st .st-etapes button.on{border-color:var(--accent);background:var(--accent-clair)}
  .st .st-etapes button:hover{background:var(--accent-clair);color:var(--texte)}
  .st-etapes button.on .num{background:var(--accent);color:#fff;border-color:var(--accent)}
  .st-etapes button.on .lb{color:var(--accent);font-weight:600}
  .st-etapes .point{position:absolute;top:5px;right:7px;width:12px;height:12px;border-radius:999px;background:#b4231f;border:2px solid var(--surface)}
  .st-etapes .point.orange{background:#c98300}
  .st-carte{background:var(--fond-2);border:1px solid var(--trait);border-radius:14px;padding:14px;margin:0 0 10px}
  .st-carte.recidive{border-color:#b4231f;border-left-width:5px}
  .st-tete{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .st-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
  .st-btns.col{flex-direction:column;align-items:stretch;margin-top:0}
  .st .st-btn,.st-ovl .st-btn{font:500 15px/1.2 system-ui;cursor:pointer;border-radius:9px;border:1px solid var(--filet-2);background:var(--surface);color:var(--texte);padding:10px 14px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;text-align:center}
  .st .st-btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .st .st-btn:hover{background:var(--accent-clair);color:var(--texte);border-color:var(--filet-2)}
  .st .st-btn.pri:hover{background:var(--accent-fonce);color:#fff}
  .st .st-btn.large{width:100%;margin-top:12px;padding:13px;font-size:16px}
  .st-btn[disabled]{opacity:.45;cursor:not-allowed}
  .st-badge{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
  .st-badge.gris{color:#555;background:#e8eaed}.st-badge.orange{color:#7a4f00;background:#fde9c2}
  .st-badge.vert{color:#12602c;background:#d7f0df}.st-badge.rouge{color:#8a1a16;background:#fbd9d6}
  .st-lig{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--trait)}
  .st-lab{font-size:15px}.st-dates{font-size:12.5px;color:var(--texte-2);line-height:1.45}
  .st-dates.suite{padding:2px 0 2px 30px}
  .st .st-lien,.st-ovl .st-lien{display:inline;background:none;border:0;color:var(--accent);font:400 13.5px/1.3 system-ui;padding:4px 0;cursor:pointer;text-decoration:underline;text-align:left}
  .st .st-lien:hover{background:none;color:var(--accent-fonce)}
  .st .st-lien.decale{padding:0 0 10px 30px}
  .st .st-retour{display:inline;background:none;border:0;color:var(--accent);font:500 15px/1.3 system-ui;padding:0 0 10px;cursor:pointer}
  .st .st-retour:hover{background:none;color:var(--accent-fonce)}
  .st-vide{font-size:13.5px;color:var(--texte-2);margin:4px 0}
  .st-note{font-size:13px;border-left:3px solid #9a6400;background:#fef6e6;color:#4d3300;padding:8px 10px;border-radius:0 8px 8px 0;margin:10px 0}
  .st-note.rouge{border-left-color:#b4231f;background:#fdecea;color:#7a1512}
  .st-alerte{font-size:13px;color:#b4231f;font-weight:600;margin:8px 0}
  .st-etat{font-size:14px;margin:6px 0 4px;color:#1f7a3d;font-weight:600}.st-etat.oui{color:#b4231f}
  .st-ech{font-size:13px;color:var(--texte-2);margin:8px 0}.st-ech b{color:var(--texte)}
  .st-grp{border-top:1px solid var(--trait)}
  .st .st-coche{display:flex;gap:10px;align-items:flex-start;padding:9px 0 4px;cursor:pointer;font-size:15px;color:var(--texte)}
  .st-coche input{width:20px;height:20px;margin:2px 0 0;flex:none}
  .st .st-coche.petit{border-top:1px solid var(--trait);margin-top:4px;font-size:13.5px;color:var(--texte-2)}
  .st-connu{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 2px 30px;font-size:13px;color:var(--texte-2)}
  .st-connu.bloc{padding:10px 0 0}
  .st .st-connu label{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13.5px;color:var(--texte-2)}
  .st .st-connu input[type=date]{width:auto;font:400 15px/1.2 system-ui;padding:7px 9px;border-radius:8px;border:1px solid var(--filet-2);background:var(--surface);color:var(--texte)}
  .st-champ input,.st-champ select,.st select{font:400 16px/1.3 system-ui;padding:10px 11px;border-radius:8px;border:1px solid var(--filet-2);background:var(--surface);color:var(--texte)}
  .st select{width:100%;margin-top:6px}
  .st-repli{border:1px solid var(--trait);border-radius:14px;padding:12px 14px;margin:0 0 10px;background:var(--fond-2)}
  .st-repli>summary{cursor:pointer;font-weight:600;font-size:14px}
  .st-repli.dedans{margin:14px 0 0}
  .st .st-sup,.st-ovl .st-sup{background:none;border:0;color:var(--texte-2);font:400 22px/1 system-ui;cursor:pointer;padding:4px 8px;min-width:36px}
  .st .st-sup:hover,.st-ovl .st-sup:hover{background:none;color:var(--rouge)}
  ul.st-cf{list-style:none;margin:0;padding:0}
  ul.st-cf li{padding:9px 0;border-top:1px solid var(--trait)}ul.st-cf li:first-child{border-top:0}
  .st ul.st-cf button{display:block;width:100%;background:none;border:0;color:var(--texte);text-align:left;padding:2px 0;cursor:pointer;font:400 15px/1.3 system-ui;border-radius:0}
  .st ul.st-cf button:hover{background:none;color:var(--accent)}
  ul.st-cf .l{display:block;font-size:14px;font-weight:600}ul.st-cf .d{display:block;font-size:12.5px;color:var(--texte-2);margin-top:2px}
  /* la fenêtre du bas, pour un relevé, un document, une saisie */
  .st-ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:60}
  .st-ovl.on{display:flex}
  .st-modale{background:var(--surface);color:var(--texte);width:100%;max-width:560px;max-height:92vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
  .st-mtop{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--trait)}
  .st-mtop b{font-size:16px}.st-ovl .st-mtop button{border:0;background:none;font:400 26px/1 system-ui;color:var(--texte-2);padding:2px 8px;cursor:pointer}
  .st-ovl .st-mtop button:hover{background:none;color:var(--texte)}
  .st-mc{overflow:auto;padding:0 0 6px;flex:1}
  .st-ma{display:flex;gap:8px;padding:10px 12px 14px;border-top:1px solid var(--trait)}
  .st-ovl .st-ma button{flex:1;font:500 16px/1.2 system-ui;padding:13px 10px;min-height:48px;border-radius:9px;border:1px solid var(--filet-2);background:var(--surface);color:var(--texte);cursor:pointer}
  .st-ovl .st-ma button:hover{background:var(--accent-clair);color:var(--texte)}
  .st-ovl .st-ma button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .st-ovl .st-ma button.pri:hover{background:var(--accent-fonce);color:#fff}
  .st-ma button[disabled]{opacity:.5}
  .st-aide{font-size:13px;color:var(--texte-2);margin:10px 14px}
  .st-res{margin:12px 14px;font-size:14.5px}.st-res p{margin:6px 0}.st-res .t{font-weight:600;font-size:15.5px}
  .st-res h4{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--texte-2);margin:14px 0 6px}
  table.st-tb{width:100%;border-collapse:collapse;font-size:13.5px}
  table.st-tb th,table.st-tb td{border-top:1px solid var(--trait);padding:6px 4px;text-align:left;vertical-align:top}
  table.st-tb th{font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--texte-2);border-top:0}
  table.st-tb td.n{white-space:nowrap}
  .st-champ{margin:12px 14px;font-size:14px}.st-champ.serre{margin:10px 0}
  .st-champ label{display:block;color:var(--texte-2);font-size:13.5px;margin-bottom:4px}
  .st-champ input,.st-champ select{width:100%;box-sizing:border-box}
  /* SUR IPHONE, UN CHAMP DE DATE SORTAIT DE L'ÉCRAN. Relevé le 21 novembre
     2026 sur « Saisir une infraction » : Safari donne à ce champ une largeur
     propre, qui ignore width:100 % et dépasse le bord droit. On lui retire
     son habillage d'origine pour qu'il suive la largeur de sa ligne, texte à
     gauche comme les autres champs. */
  .st input[type=date],.st-ovl input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;
    box-sizing:border-box;min-height:42px;text-align:left}
  .st input[type=date]::-webkit-date-and-time-value,.st-ovl input[type=date]::-webkit-date-and-time-value{text-align:left}
  .st-champ input[type=date]{display:block}
  .st-champ canvas{display:block;width:100%;height:170px;border:1px solid var(--trait);border-radius:10px;background:#fff;touch-action:none}
  .st-doc{background:#fff;color:#1c2024;margin:12px 14px;border:1px solid #ddd;border-radius:10px;padding:16px;font-size:13.5px;line-height:1.5}
  .st-doc .ent{font-weight:700;margin:0 0 6px}.st-doc .ent small{display:block;font-weight:400;color:#444;font-size:11.5px}
  .st-doc h3{font-size:15px;text-align:center;margin:12px 0}.st-doc h4{font-size:13.5px;margin:10px 0 2px}.st-doc p{margin:7px 0}
  .st-doc .q{font-size:12px;color:#555}
  .st-doc table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
  .st-doc th,.st-doc td{border:1px solid #ccc;padding:4px 6px;text-align:left;vertical-align:top}
  .st-sig{display:block;max-width:220px;height:auto;border:1px solid #ddd;border-radius:6px;background:#fff;margin:8px 0}
  .st-toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1c2024;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:70;max-width:86vw;text-align:center}
  .st-toast.on{opacity:1}
  .vu-res details,.vu-reg{margin:8px 0}
  .vu-res summary,.vu-reg summary{cursor:pointer;font-weight:600;font-size:var(--t2);padding:4px 0}
  .vu-res .alerte{border-left:4px solid #8a2020;padding:6px 10px;background:var(--fond);font-size:var(--t2)}
  .vu-res .vu-liste{margin:6px 0 0;padding-left:20px;font-size:var(--t2)}
  .vu-res table.ech,.vu-reg table.ech{font-size:13px}
</style>
</head>
<body>
<div class="enveloppe">
  <div class="haut"><a class="retour" href="gerer.html">&larr; Retour</a></div>
  <h1 class="titre">Suivi tachygraphe</h1>
  <p class="sous">Le dispositif à tenir au quotidien, conducteur par conducteur, et le dossier prêt en cas de contrôle.</p>
  <div id="corps"></div>
</div>

<script src="documents-transport.js"></script>
<script src="flotte.js"></script>
<script src="tableur-export.js"></script>
<script src="apercu.js"></script>
<script src="audit-export.js"></script>
<script src="base-documents.js"></script>
<script src="lire-pdf.js"></script>
<script src="lecture-carte.js"></script>
<script src="lecture-vehicule.js"></script>
<script src="lecture-rapport.js"></script>
<script src="conformite-transport.js"></script>
<script src="suivi-tachygraphe.js"></script>
<script>
"use strict";
(function () {
  var CT = window.ConformiteTransport;
  var corps = document.getElementById("corps");
  function ech(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}
  /* Une date ISO rendue en français : 2027-01-31 devient 31 janv. 2027. */
  function joliDate(iso){
    if(!iso) return "";
    try{ return new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"short",year:"numeric"})
      .format(new Date(iso+"T00:00:00")); }catch(e){ return iso; }
  }

  if (!CT || !CT.estTransport()) {
    corps.innerHTML = '<div class="nontransport">Ce module s\'adresse aux entreprises de transport routier ' +
      '(convention IDCC 16). La fiche d\'entreprise n\'indique pas ce secteur : renseignez-la pour l\'activer.</div>';
    return;
  }

  /* ─── bloc d'un document ─── */
  function rendreBloc(bl) {
    var t = ech(bl.t);
    if (bl.k === "h1") return '<div class="bloc-h1">' + t + '</div>';
    if (bl.k === "h2") return '<div class="bloc-h2">' + t + '</div>';
    if (bl.k === "note") return '<p class="bloc-note">' + t + '</p>';
    if (bl.k === "table") return '<div class="bloc-table">' + t.split(" | ").join("   |   ") + '</div>';
    if (bl.k === "sign") return '<p class="bloc-note">' + t + '</p><p>Date et signature : ______________________</p>';
    return '<p>' + t + '</p>';
  }
  function rendreDoc(d) {
    var h = '';
    d.blocs.forEach(function (bl) { h += rendreBloc(bl); });
    h += '<div class="volet"><b>Formalités</b><ul>';
    d.formalites.forEach(function (f) { h += '<li>' + ech(f) + '</li>'; });
    h += '</ul></div><div class="volet"><b>Le droit</b><ul>';
    d.droit.forEach(function (f) { h += '<li>' + ech(f) + '</li>'; });
    h += '</ul></div>';
    return h;
  }

  var html = '';

  /* ───────── LE POINT D'ENTRÉE : LA FICHE DE CHAQUE CONDUCTEUR ───────── */
  html += '<div class="espace"><h2>Les conducteurs</h2>' +
    '<p class="sous3">Choisissez un conducteur, puis avancez en quatre étapes : les instructions qu\'il a signées, ' +
    'le contrôle par la lecture de sa carte et du camion, la réaction, et le coffre-fort.</p>' +
    '<div id="cond-liste"></div></div>';

  /* ───────────────── ÉCHÉANCIER DES TÉLÉCHARGEMENTS ───────────────── */
  html += '<div class="espace"><h2>Échéancier des téléchargements</h2>' +
    '<p class="sous3">Carte tous les ' + CT.DELAI_CARTE + ' jours (registre), véhicule tous les ' +
    CT.DELAI_VEHICULE + ' jours (flotte). Portez la dernière date, l\'échéance se calcule.</p>' +
    '<div id="ech-corps"></div>' +
    '<div class="carte" style="margin-top:12px"><h3>Certificat du conseiller ADR</h3>' +
    '<p class="sous3">Fin de validité : <input type="date" id="date-adr"> ' +
    '<span id="adr-etat"></span></p></div></div>';

  /* ─── les modèles du dispositif, repliés : utiles, mais pas en premier ─── */
  html += '<details class="espace repli"><summary>Les documents du dispositif (consigne, journal, registre, compte rendu)</summary>';
  CT.documents().forEach(function (d) {
    html += '<div class="carte"><h3>' + ech(d.nom) + '</h3>' +
      '<p class="sous3">' + ech(d.sous) + '</p>' +
      '<button data-doc="' + d.cle + '">Voir le modèle</button> ' +
      '<button data-word="' + d.cle + '">Télécharger en Word</button>' +
      '<div class="doc" id="doc-' + d.cle + '">' + rendreDoc(d) + '</div></div>';
  });
  html += '</details>';

  /* ───────────────── ESPACE B : DÉFENSE ───────────────── */
  var def = CT.defense();
  html += '<div class="espace"><h2>En cas de contrôle ou de saisine de la commission</h2>';
  html += '<div class="carte"><h3>Rétroplanning des délais</h3>' +
    '<p class="sous3">Date de la séance : <input type="date" id="date-seance"></p>' +
    '<table class="ech retro"><thead><tr><th>Étape</th><th>Règle</th><th>Date</th></tr></thead>' +
    '<tbody id="retro-corps"></tbody></table></div>';
  html += '<div class="carte"><h3>' + ech(def.note.titre) + '</h3><div class="doc ouvert">';
  def.note.blocs.forEach(function (bl) { html += rendreBloc(bl); });
  html += '</div></div>';
  html += '<div class="carte"><h3>Liste des moyens à vérifier</h3><div class="doc ouvert"><ul>';
  def.checklist.forEach(function (m) { html += '<li>' + ech(m) + '</li>'; });
  html += '</ul></div></div>';
  html += '<div class="carte"><h3>Proportionnalité : conséquences d\'une sanction</h3><div class="doc ouvert"><ul>';
  def.proportionnalite.phrases.forEach(function (m) { html += '<li>' + ech(m) + '</li>'; });
  html += '</ul></div></div>';
  html += '<div class="carte"><h3>Tableau des infractions</h3>' +
    '<p class="sous3">Une ligne par infraction, avec les véhicules et conducteurs repris de la flotte et du registre.</p>' +
    '<button id="export-infractions">Télécharger le classeur</button></div>';
  html += '<div class="carte"><h3>Délai pour sanctionner un conducteur</h3>' +
    '<p class="sous3">Date de connaissance des faits : <input type="date" id="date-connaissance"></p>' +
    '<div id="delai-disc"></div></div>';
  html += '</div>';

  corps.innerHTML = html;

  /* ─── interactions ─── */
  corps.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-doc]");
    if (b) document.getElementById("doc-" + b.getAttribute("data-doc")).classList.toggle("ouvert");
    var w = e.target.closest("button[data-word]");
    if (w) { if (!CT.enWord(w.getAttribute("data-word"))) alert("Le générateur Word n'est pas disponible sur cette page."); }
    if (e.target.id === "export-infractions") {
      if (!CT.exportInfractions()) alert("Le moteur d'export n'est pas disponible sur cette page.");
    }
  });

  /* délai disciplinaire (L. 1332-4) */
  document.getElementById("date-connaissance").addEventListener("change", function (e) {
    var cible = document.getElementById("delai-disc");
    var d = CT.delaiDisciplinaire(e.target.value);
    if (!d) { cible.textContent = ""; return; }
    cible.innerHTML = '<p>Dernier jour pour engager la sanction : <b>' + ech(d.echeance) +
      '</b> <span class="pastille f-' + (d.jours < 0 ? "rouge" : d.jours <= 7 ? "orange" : "vert") +
      '">' + ech(d.etat) + (d.jours != null ? " (" + d.jours + " j)" : "") + '</span></p>' +
      '<p class="bloc-note">' + ech(d.reserve) + '</p>';
  });

  /* échéancier : une fiche par véhicule et par conducteur, lisible de haut en
     bas sur un téléphone, plutôt qu'un tableau à cinq colonnes qui déborde. */
  function peindreEch() {
    var tb = document.getElementById("ech-corps"), L = CT.echeances(), h = '';
    if (!L.length) {
      tb.innerHTML = '<p class="vide">La flotte et le registre ne portent encore ni véhicule ni conducteur.</p>';
      return;
    }
    L.forEach(function (x, i) {
      var carte = x.quoi.indexOf("carte") >= 0;
      var titre = carte ? "Carte conducteur" : "Véhicule";
      var fond = x.fond || "gris";
      h += '<div class="echeance b-' + fond + '">' +
        '<div class="et-titre">' + titre + ' : ' + ech(x.qui) + '</div>' +
        '<div class="et-ligne"><span class="lab">Dernier téléchargement</span>' +
        '<input type="date" data-k="' + (carte ? "c" : "v") + '" data-qui="' + ech(x.qui) +
        '" value="' + (x.dernier || "") + '"></div>' +
        '<div class="et-ligne"><span class="lab">Prochaine limite</span>' +
        '<span><b>' + (x.date ? ech(joliDate(x.date)) : "à renseigner") + '</b> ' +
        '<span class="pastille f-' + fond + '">' + ech(x.etat) +
        (x.jours != null ? " (" + x.jours + " j)" : "") + '</span></span></div>';
      if (!carte) {
        /* Lecture du fichier du tachygraphe du véhicule : la date du dernier
           téléchargement se porte seule, et la conduite sans carte s'affiche. */
        h += '<div class="et-ligne"><span class="lab">Fichier du tachygraphe (.V1B)</span>' +
          '<input type="file" data-lire-v="' + i + '" data-qui="' + ech(x.qui) +
          '" accept=".V1B,.v1b,.ddd,.DDD,.tgd,.TGD,application/octet-stream"></div>' +
          '<div class="vu-res" id="vu-res-' + i + '"></div>';
        /* Le registre du véhicule : ce qui y a été porté reste, d'une visite à l'autre. */
        var reg = CT.anomaliesVehicule(x.qui);
        if (reg.length) {
          h += '<details class="vu-reg"><summary>Registre du véhicule : ' + reg.length + ' fait' + (reg.length > 1 ? 's' : '') +
            ' de conduite sans carte</summary>' +
            '<table class="ech"><thead><tr><th>Date</th><th>Détail</th><th></th></tr></thead><tbody>';
          reg.forEach(function (r, k) {
            h += '<tr><td>' + ech(joliDate(r.date)) + '</td><td>' + ech(r.detail) + '</td><td>' +
              '<button class="sup" data-sup-v="' + k + '" data-qui="' + ech(x.qui) + '" title="Supprimer">×</button></td></tr>';
          });
          h += '</tbody></table><p><button data-vider-v="1" data-qui="' + ech(x.qui) + '">Vider le registre de ce véhicule</button></p></details>';
        }
      }
      h += '</div>';
    });
    tb.innerHTML = h;
    /* Un fichier déjà lu reste affiché quand l'échéancier se repeint. */
    L.forEach(function (x, i) { if (vuLus[x.qui]) peindreVehicule(i, x.qui, vuLus[x.qui]); });
  }
  var vuLus = {};
  peindreEch();
  document.getElementById("ech-corps").addEventListener("change", function (e) {
    var inp = e.target;
    var lv = inp.closest ? inp.closest("[data-lire-v]") : null;
    if (lv && inp.type === "file") {
      var f = inp.files && inp.files[0];
      if (f) { var im = lv.getAttribute("data-qui"), idx = lv.getAttribute("data-lire-v"); inp.value = ""; lireVehiculePour(idx, im, f); }
      return;
    }
    if (inp.type !== "date" || !inp.value) return;
    var qui = inp.getAttribute("data-qui");
    if (inp.getAttribute("data-k") === "c") {
      var s = CT.salaries().filter(function (x) { return x.nom === qui; })[0];
      if (s) CT.porterTelechargementCarte(s.id, inp.value);
    } else {
      CT.porterTelechargementVehicule(qui, inp.value);
    }
    peindreEch();
  });

  /* Lecture d'un fichier de téléchargement d'unité véhicule (.V1B). On porte
     seul la date du dernier téléchargement, et on montre, pour le véhicule, la
     période, les conducteurs enregistrés, la conduite sans carte et ce que
     l'appareil a noté. Rien n'est envoyé : tout se lit dans le navigateur. */
  function memeImmat(x, y) {
    function n(s) { return String(s || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase(); }
    return n(x) === n(y);
  }
  function lireVehiculePour(idx, immatRow, f) {
    var cible = document.getElementById("vu-res-" + idx);
    function dire(msg) { if (cible) cible.innerHTML = '<p class="vide">' + msg + '</p>'; }
    dire("Lecture du fichier…");
    if (!window.LectureVehicule) { dire("Le lecteur de fichier véhicule n'est pas disponible sur cette page."); return; }
    var fr = new FileReader();
    fr.onload = function () {
      var buf = fr.result;
      if (!window.LectureVehicule.estVehicule(buf)) {
        dire("Ce fichier n'est pas un téléchargement d'unité véhicule. Déposez le fichier .V1B tiré du tachygraphe du véhicule ; la carte d'un conducteur se lit dans sa fiche.");
        return;
      }
      var a;
      try { a = window.LectureVehicule.analyser(window.LectureVehicule.lire(buf)); }
      catch (err) { dire("Fichier illisible : " + ech(err && err.message || err)); return; }
      if (!a) { dire("Fichier véhicule illisible."); return; }
      a.fichier = f.name;
      a.memeVehicule = memeImmat(a.immatriculation, immatRow);
      /* La date ne se porte que si le fichier est bien celui de ce véhicule. */
      if (a.memeVehicule && a.telechargement) CT.porterTelechargementVehicule(immatRow, a.telechargement);
      /* Ce que chaque carte a fait dans ce véhicule, gardé pour compléter les cartes. */
      if (a.memeVehicule) CT.porterJoursVehicule(immatRow, a.parCarte);
      vuLus[immatRow] = a;
      peindreEch();
    };
    fr.onerror = function () { dire("Le fichier n'a pas pu être ouvert."); };
    fr.readAsArrayBuffer(f);
  }

  function tableRepliee(titre, n, corps) {
    return n > 12 ? '<details><summary>' + titre + ' (' + n + ')</summary>' + corps + '</details>' : corps;
  }
  function peindreVehicule(idx, immatRow, a) {
    var cible = document.getElementById("vu-res-" + idx);
    if (!cible) return;
    function pl(n, mot) { return n + ' ' + mot + (n > 1 ? 's' : ''); }
    var h = '<div class="doc ouvert" style="margin-top:8px">';
    h += '<div class="bloc-h2">Fichier lu, ' + (a.generation === 1 ? "tachygraphe de 1re génération" : "tachygraphe de 2e génération") + '</div>';
    h += '<p>' + ech(a.immatriculation || "immatriculation non lue") + (a.vin ? '  ·  châssis ' + ech(a.vin) : '') + '</p>';
    if (!a.memeVehicule) h += '<p class="alerte">Ce fichier est celui du véhicule ' + ech(a.immatriculation || "inconnu") +
      ', pas celui de cette ligne (' + ech(immatRow) + '). La date du dernier téléchargement n\'a pas été portée et rien ne peut être inscrit au registre depuis ici : déposez le fichier sur la bonne ligne.</p>';
    if (a.lecture && !a.lecture.complete) h += '<p class="alerte">Lecture incomplète. ' +
      a.lecture.reserves.map(ech).join(' ') + ' Ce qui suit ne vaut que pour la partie lue.</p>';

    if (a.telechargement) h += '<p class="sous3">Téléchargé le ' + ech(joliDate(a.telechargement)) + '.' +
      (a.activite ? ' ' + pl(a.nbJours, 'journée') + ' d\'activité, du ' + ech(joliDate(a.activite.du)) + ' au ' + ech(joliDate(a.activite.au)) + '.' : '') + '</p>';
    var prec = a.telechargementPrecedent;
    if (prec && prec.date) {
      var ecartJ = a.telechargement ? Math.round((new Date(a.telechargement) - new Date(prec.date)) / 86400000) : null;
      h += '<p class="sous3">Téléchargement précédent : ' + ech(joliDate(prec.date)) + (prec.societe ? ' (' + ech(prec.societe) + ')' : '') +
        (ecartJ != null ? ', soit ' + pl(ecartJ, 'jour') + ' avant celui-ci' : '') + '.</p>';
    }
    if (a.verrous.length) {
      var ouverts = a.verrous.filter(function (v) { return !v.au; });
      h += '<p class="sous3">Verrou d\'entreprise : ' + a.verrous.map(function (v) {
        return ech(v.societe || "société non lue") + ', posé le ' + ech(joliDate(v.du)) + (v.au ? ', levé le ' + ech(joliDate(v.au)) : ', toujours en place');
      }).join(' ; ') + '.' + (ouverts.length ? '' : ' Aucun verrou d\'entreprise n\'est en place dans ce fichier.') + '</p>';
    }
    if (a.controles.length) h += '<p class="sous3">' + pl(a.controles.length, 'contrôle') + ' enregistré' + (a.controles.length > 1 ? 's' : '') + ' par l\'appareil : ' +
      a.controles.map(function (c) {
        var fait = []; if (c.carteTelechargee) fait.push("carte téléchargée"); if (c.vehiculeTelecharge) fait.push("appareil téléchargé");
        if (c.impression) fait.push("impression"); if (c.affichage) fait.push("affichage");
        return ech(joliDate(c.date)) + (fait.length ? ' (' + fait.join(', ') + ')' : '');
      }).join(' ; ') + '.</p>';
    if (a.cartes.length) h += '<p class="sous3">Cartes insérées sur la période : ' +
      a.cartes.map(function (c) { return ech(c.titulaire || c.numero); }).join(', ') + '.</p>';

    /* La conduite sans carte : le fait que seul le fichier du véhicule révèle. */
    var sc = a.sansCarte || [];
    h += '<div class="bloc-h2">Conduite sans carte</div>';
    if (sc.length) {
      h += '<p class="sous3">' + pl(sc.length, 'journée') + ' sur ' + a.nbJours + ', pour ' + ech(a.hhmm(a.totalSansCarte)) +
        ' au total. Seules les journées d\'au moins ' + a.seuil + ' minutes sont retenues.</p>';
      var c1 = '<table class="ech"><thead><tr><th>Date</th><th>Durée</th><th>Heures (temps universel)</th></tr></thead><tbody>';
      sc.slice().reverse().forEach(function (j) {
        c1 += '<tr><td>' + ech(joliDate(j.date)) + '</td><td>' + ech(a.hhmm(j.conduiteSansCarte)) + '</td><td>' +
          j.segments.map(function (s) { return ech(s.de) + ' à ' + ech(s.a); }).join(', ') + '</td></tr>';
      });
      c1 += '</tbody></table>';
      h += tableRepliee('Voir le détail jour par jour', sc.length, c1);
    } else {
      h += '<p class="vide">' + (a.nbJours ? 'Aucune journée ne porte ' + a.seuil + ' minutes ou plus de conduite sans carte, sur les ' + a.nbJours + ' lues.'
        : 'Aucune journée d\'activité n\'a été lue : on ne peut rien en conclure.') + '</p>';
    }
    if (a.joursEnEcart.length) h += '<p class="alerte">' + pl(a.joursEnEcart.length, 'journée') +
      ' où les lignes d\'activité et les heures d\'insertion de carte ne concordent pas (' +
      a.joursEnEcart.map(function (d) { return ech(joliDate(d)); }).join(', ') + ') : à vérifier sur le relevé.</p>';

    /* Ce que l'appareil garde en mémoire hors des journées téléchargées. */
    var couverts = {}; a.jours.forEach(function (j) { couverts[j.date] = 1; });
    var hors = a.appareilSansCarte.filter(function (e) { return !couverts[e.debut] && e.dureeMin; });
    if (hors.length) {
      h += '<p class="sous3">En dehors de ces journées, l\'appareil garde en mémoire ' + pl(hors.length, 'événement') + ' de conduite sans carte :</p>';
      var c2 = '<table class="ech"><thead><tr><th>Date</th><th>Heure</th><th>Durée</th></tr></thead><tbody>';
      hors.slice().sort(function (x, y) { return x.debut < y.debut ? 1 : -1; }).forEach(function (e) {
        c2 += '<tr><td>' + ech(joliDate(e.debut)) + '</td><td>' + ech(e.heure) + '</td><td>' + ech(a.hhmm(e.dureeMin)) + '</td></tr>';
      });
      h += c2 + '</tbody></table>';
    }
    h += '<p class="bloc-note">Les heures sont celles du tachygraphe, en temps universel : en France, ajouter une heure en hiver et deux en été. La conduite sans carte n\'est imputable à un conducteur que si l\'on établit qui roulait.</p>';
    if (a.anomalies.length && a.memeVehicule) h += '<p><button data-porter-v="' + idx + '" data-qui="' + ech(immatRow) + '">Porter ces ' +
      a.anomalies.length + ' faits au registre du véhicule</button></p>';

    /* Les excès de vitesse enregistrés. */
    if (a.survitesses.length) {
      h += '<div class="bloc-h2">Excès de vitesse enregistrés</div>';
      var c3 = '<table class="ech"><thead><tr><th>Date</th><th>Maximum</th><th>Moyenne</th></tr></thead><tbody>';
      a.survitesses.slice().sort(function (x, y) { return (y.debut || "").localeCompare(x.debut || ""); }).forEach(function (e) {
        c3 += '<tr><td>' + ech(joliDate(e.debut) || "") + '</td><td>' + ech(e.vMax) + ' km/h</td><td>' + ech(e.vMoyenne) + ' km/h</td></tr>';
      });
      h += tableRepliee('Voir les excès de vitesse', a.survitesses.length, c3 + '</tbody></table>');
    }
    /* Le reste : résumé par nature, détail replié. L'appareil garde des années. */
    var ev = a.evenements.concat(a.defauts).filter(function (e) { return e.code !== 0x04; });
    if (ev.length) {
      var par = {};
      ev.forEach(function (e) { par[e.nom] = (par[e.nom] || 0) + 1; });
      h += '<div class="bloc-h2">Autres événements et défauts en mémoire</div><ul class="vu-liste">' +
        Object.keys(par).sort(function (x, y) { return par[y] - par[x]; }).map(function (n) {
          return '<li>' + ech(n) + ' : ' + par[n] + '</li>'; }).join('') + '</ul>';
      var c4 = '<table class="ech"><thead><tr><th>Date</th><th>Nature</th></tr></thead><tbody>';
      ev.slice().sort(function (x, y) { return (y.debut || "").localeCompare(x.debut || ""); }).forEach(function (e) {
        c4 += '<tr><td>' + ech(joliDate(e.debut) || "") + '</td><td>' + ech(e.nom) + '</td></tr>'; });
      h += '<details><summary>Voir le détail daté (' + ev.length + ')</summary>' + c4 + '</tbody></table></details>';
      h += '<p class="bloc-note">Libellés de l\'annexe 1B du règlement (CE) n° 1360/2002. Les codes plus récents ou propres au constructeur sont rendus par leur numéro.</p>';
    }
    h += '<p class="bloc-note">Fichier ' + ech(a.fichier || "") + ', lu dans le navigateur : rien n\'est envoyé. Sa signature n\'est pas vérifiée ici.</p>';
    h += '</div>';
    cible.innerHTML = h;
  }
  document.getElementById("ech-corps").addEventListener("click", function (e) {
    var b = e.target.closest("[data-porter-v]"), q;
    if (b) {
      q = b.getAttribute("data-qui");
      var a = vuLus[q]; if (!a || !a.memeVehicule) return;
      var n = CT.importerAnomaliesVehicule(q, a.anomalies);
      peindreEch();
      alert(n + " fait" + (n > 1 ? "s" : "") + " porté" + (n > 1 ? "s" : "") + " au registre du véhicule " + q +
        (n < a.anomalies.length ? " (" + (a.anomalies.length - n) + " déjà présent" + (a.anomalies.length - n > 1 ? "s" : "") + ")" : "") + ".");
      return;
    }
    b = e.target.closest("[data-sup-v]");
    if (b) { CT.supprimerAnomalieVehicule(b.getAttribute("data-qui"), +b.getAttribute("data-sup-v")); peindreEch(); return; }
    b = e.target.closest("[data-vider-v]");
    if (b) { q = b.getAttribute("data-qui");
      if (confirm("Vider le registre du véhicule " + q + " ?")) { CT.viderAnomaliesVehicule(q); peindreEch(); } }
  });

  /* certificat ADR */
  function peindreADR() {
    var e = CT.echeanceADR(), s = document.getElementById("adr-etat");
    var inp = document.getElementById("date-adr");
    if (e) { inp.value = e.date;
      s.innerHTML = '<span class="pastille f-' + e.fond + '">' + ech(e.etat) +
        (e.jours != null ? " (" + e.jours + " j)" : "") + '</span>'; }
    else s.textContent = "";
  }
  peindreADR();
  document.getElementById("date-adr").addEventListener("change", function (e) {
    if (e.target.value) { CT.porterCertificatADR(e.target.value); peindreADR(); }
  });

  /* LA FICHE DU CONDUCTEUR : le suivi tachygraphe en quatre étapes
     (instructions, contrôle et suivi, réaction, coffre-fort). L'écran est dans
     suivi-tachygraphe.js ; cette page lui passe la lecture des rapports PDF,
     qui ventile sur plusieurs conducteurs, et repeint l'échéancier quand une
     date de téléchargement a été portée. */
  var ST = window.SuiviTachygraphe.monter({
    cont: document.getElementById("cond-liste"),
    lirePdf: function (id, f) { lireCartePour(id, f); },
    apresChangement: function () { peindreEch(); }
  });
  function peindreConducteurs() { ST.peindre(); }
  function reouvrir(id) { ST.choisir(id); }
  /* ARRIVER SUR UN CONDUCTEUR DONNÉ. La page des salariés ouvre le suivi de
     la personne choisie par « ?c=identifiant » : on ne lui fait pas rechercher
     son conducteur une seconde fois. */
  (function () {
    var c = null;
    try { c = new URLSearchParams(location.search).get("c"); } catch (e) { c = null; }
    if (!c) return;
    var connu = (window.ConformiteTransport.salaries() || []).some(function (x) { return x.id === c; });
    if (connu) { ST.choisir(c); ST.peindre(); }
  })();
  function aujourdhuiIso() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  peindreConducteurs();
  /* Un rapport multi-conducteurs (correspondance, infractions) porte le nom du
     conducteur sur chaque anomalie. On ventile chacune au conducteur du registre
     dont le nom correspond, par les mots partagés (au moins deux, sans
     ambiguïté). Ce qui ne se rattache pas - conducteur hors effectif, ou nom
     manquant - est listé à part, à confirmer à la main. */
  function ventilerParNom(anoms) {
    var sals = (CT && CT.salaries) ? CT.salaries() : [];
    function toks(s) {
      return String(s || "").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
        .replace(/[^A-Z]+/g, " ").trim().split(" ").filter(function (w) { return w.length >= 2 && w !== "TEC"; });
    }
    var salToks = sals.map(function (s) { return { id: s.id, nom: s.nom, t: toks(s.nom) }; });
    var groupes = {}, nonRattaches = [];
    (anoms || []).forEach(function (a) {
      var at = toks(a.conducteur);
      if (!at.length) { nonRattaches.push(a); return; }
      var best = null, bestN = 0, tie = false;
      salToks.forEach(function (s) {
        var inter = s.t.filter(function (w) { return at.indexOf(w) >= 0; }).length;
        if (inter > bestN) { bestN = inter; best = s; tie = false; }
        else if (inter === bestN && inter > 0 && best && s.id !== best.id) { tie = true; }
      });
      if (best && bestN >= 2 && !tie) { (groupes[best.id] = groupes[best.id] || []).push(a); }
      else nonRattaches.push(a);
    });
    return { groupes: groupes, nonRattaches: nonRattaches,
      nomDe: function (id) { var s = salToks.filter(function (x) { return x.id === id; })[0]; return s ? s.nom : id; } };
  }

  function messageNonRattaches(nonRattaches, intro) {
    if (!nonRattaches.length) return "";
    var noms = {};
    nonRattaches.forEach(function (a) { var c = a.conducteur || "conducteur à confirmer"; noms[c] = (noms[c] || 0) + 1; });
    return "\n\n" + intro + " :\n" +
      Object.keys(noms).map(function (c) { return "- " + c + " : " + noms[c]; }).join("\n");
  }

  function dispatcherCorrespondance(anoms) {
    var v = ventilerParNom(anoms), lignesMsg = [];
    Object.keys(v.groupes).forEach(function (id) {
      var n = CT.importerAnomalies(id, v.groupes[id], { src: "relevé de correspondance", connu: aujourdhuiIso() });
      lignesMsg.push("- " + v.nomDe(id) + " : " + n + " conduite(s) sans carte");
    });
    peindreConducteurs();
    var msg = "Rapport de correspondance : " + (anoms || []).length + " conduites sans carte lues.\n\n" +
      (lignesMsg.length ? "Rattachées au registre :\n" + lignesMsg.join("\n")
        : "Aucune n'a pu être rattachée à un conducteur du registre.");
    msg += messageNonRattaches(v.nonRattaches, "À confirmer (hors effectif, ou véhicule sans session de carte)");
    alert(msg);
  }

  function dispatcherInfractions(anoms) {
    var v = ventilerParNom(anoms), lignesMsg = [];
    Object.keys(v.groupes).forEach(function (id) {
      var grp = v.groupes[id], n = CT.importerAnomalies(id, grp, { src: "rapport d'infractions", connu: aujourdhuiIso() });
      var graves = grp.filter(function (a) { return a.grave; }).length;
      lignesMsg.push("- " + v.nomDe(id) + " : " + n + " infraction(s)" +
        (graves ? " dont " + graves + " grave(s)" : ""));
    });
    peindreConducteurs();
    lignesMsg.sort();
    var msg = "Rapport d'infractions : " + (anoms || []).length + " infraction(s) lue(s) pour " +
      Object.keys(v.groupes).length + " conducteur(s).\n\n" +
      (lignesMsg.length ? "Portées au registre :\n" + lignesMsg.join("\n")
        : "Aucune n'a pu être rattachée à un conducteur du registre.");
    msg += messageNonRattaches(v.nonRattaches, "À confirmer (conducteur hors effectif)");
    alert(msg);
  }

  function lireCartePour(id, f) {
    var cible = document.getElementById("cond-" + id);
    var fr = new FileReader();
    fr.onload = function () {
      var buf = fr.result, tete = new Uint8Array(buf.slice(0, 5));
      var estPdf = /\.pdf$/i.test(f.name) ||
        (tete[0] === 0x25 && tete[1] === 0x50 && tete[2] === 0x44 && tete[3] === 0x46);
      /* Un fichier véhicule (.V1B) déposé ici n'est pas une carte de conducteur :
         la conduite sans carte n'est imputable à personne. On renvoie à
         l'échéancier, où le fichier du tachygraphe du véhicule se lit. */
      if (window.LectureVehicule && window.LectureVehicule.estVehicule(buf)) {
        alert("Ce fichier est un téléchargement d'unité véhicule (.V1B), pas une carte de conducteur. " +
          "Déposez-le dans l'échéancier des téléchargements, sur la ligne du véhicule : sa conduite sans " +
          "carte et ses événements s'y affichent, et la date du dernier téléchargement s'y porte seule.");
        return;
      }
      /* Un classeur Excel ou un texte : on ne le lit pas, on le dit. */
      if (/\.(xlsx|xls|xlsm|csv|txt|docx?)$/i.test(f.name) ||
          (tete[0] === 0x50 && tete[1] === 0x4b && !estPdf)) {
        alert("Ce fichier n'est pas lu ici. Déposez la carte du conducteur (.ddd ou .C1B), " +
          "le relevé de correspondance ou le rapport d'infractions en PDF. Un classeur ou une note " +
          "d'analyse ne sont pas des relevés tachygraphe.");
        return;
      }
      function importe(anoms, nonCloses) {
        var n = CT.importerAnomalies(id, anoms || [], { src: "rapport d'analyse", connu: aujourdhuiIso() });
        reouvrir(id); peindreConducteurs();
        /* Trois nombres distincts : ce qui s'ajoute, ce qui y était déjà, et ce
           qui ne s'inscrit pas au suivi (technique, indicatif ou illisible). */
        var retenues = CT.anomaliesRetenues(anoms).length, deja = retenues - n, ecartees = (anoms || []).length - retenues;
        var msg = n + " infraction" + (n > 1 ? "s" : "") + " ajoutée" + (n > 1 ? "s" : "") + " à sa fiche" +
          (deja > 0 ? " (" + deja + " déjà présente" + (deja > 1 ? "s" : "") + ")" : "") + "." +
          (ecartees > 0 ? "\n" + ecartees + " ligne" + (ecartees > 1 ? "s" : "") + " non inscrite" + (ecartees > 1 ? "s" : "") +
            " : faits techniques de l'appareil ou calculs seulement indicatifs." : "");
        /* Les journées où la carte n'a pas tout enregistré : on le dit, et on dit
           d'où vient la conduite retenue. */
        if (nonCloses && nonCloses.length) {
          var repris = nonCloses.filter(function (j) { return j.source === "véhicule"; }).length;
          var reste = nonCloses.length - repris, une = nonCloses.length === 1;
          msg += "\n\nAttention : sur " + nonCloses.length + " journée" + (une ? "" : "s") +
            ", la carte n'a pas tout enregistré : " +
            nonCloses.map(function (j) { return joliDate(j.date); }).join(", ") + ".";
          if (repris) msg += "\nLa conduite a été reprise du fichier du véhicule pour " +
            (reste ? repris + " d'entre elles." : (une ? "cette journée." : "toutes ces journées."));
          if (reste) msg += "\n" + (repris ? "Pour " + (reste === 1 ? "la dernière" : "les " + reste + " autres") : (une ? "Pour cette journée" : "Pour ces journées")) +
            ", la carte ne donne qu'un minimum : lisez le fichier du tachygraphe du véhicule dans l'échéancier, puis relisez la carte.";
        }
        alert(msg);
        if (n) ST.versReaction(id, n + " fait" + (n > 1 ? "s" : "") + " porté" + (n > 1 ? "s" : "") + " à sa fiche");
      }
      if (estPdf) {
        if (!window.LectureRapport) { alert("Le lecteur de rapport PDF n'est pas disponible."); return; }
        window.LectureRapport.lire(buf).then(function (rap) {
          var anoms = window.LectureRapport.anomalies(rap);
          if (rap.source === "pdf-correspondance") dispatcherCorrespondance(anoms);
          else if (rap.source === "pdf-infractions") dispatcherInfractions(anoms);
          else if (!anoms.length) {
            alert("Ce PDF a été lu, mais ce n'est ni un relevé d'infractions, ni un relevé de " +
              "correspondance, ni un rapport d'analyse reconnu (peut-être un graphique journalier " +
              "ou un relevé de géolocalisation). Aucune infraction n'en a été tirée.");
          } else importe(anoms);
        }).catch(function (err) { alert("PDF illisible : " + (err && err.message || err)); });
        return;
      }
      if (!window.LectureCarte) { alert("Le lecteur de carte n'est pas disponible."); return; }
      try {
        var carte = window.LectureCarte.lire(buf);
        if (!carte.identification) {
          alert("Ce fichier n'est pas une carte conducteur exploitable. C'est sans doute un " +
            "téléchargement d'unité véhicule (.V1B) ou un fichier d'un autre type. Déposez la carte " +
            "du conducteur (.ddd ou .C1B).");
          return;
        }
        var an = window.LectureCarte.analyser(carte, CT.joursVehiculePourCarte(carte.identification.numero));
        importe(an.anomalies, an.nonCloses);
      } catch (err) { alert("Fichier illisible : " + err.message); }
    };
    fr.onerror = function () { alert("Le fichier n'a pas pu être ouvert."); };
    fr.readAsArrayBuffer(f);
  }

  /* ─── lecture d'une carte conducteur ─── */
  function optionsConducteurs(sel) {
    return '<option value="">choisir le conducteur</option>' +
      CT.salaries().map(function (s) {
        return '<option value="' + s.id + '"' + (s.id === sel ? " selected" : "") + '>' + ech(s.nom) + '</option>';
      }).join("");
  }
  var carteAnalyse = null;
  var inpCarte = document.getElementById("carte-fichier");
  if (inpCarte) inpCarte.addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    var cible = document.getElementById("carte-resultat");
    if (!f) { cible.innerHTML = ""; return; }
    var fr = new FileReader();
    fr.onload = function () {
      var buf = fr.result, tete = new Uint8Array(buf.slice(0, 5));
      var estPdf = /\.pdf$/i.test(f.name) ||
        (tete[0] === 0x25 && tete[1] === 0x50 && tete[2] === 0x44 && tete[3] === 0x46);
      if (estPdf) {
        if (!window.LectureRapport) { cible.innerHTML = '<p class="vide">Le lecteur de rapport PDF n\'est pas disponible sur cette page.</p>'; return; }
        cible.innerHTML = '<p class="sous3">Lecture du rapport…</p>';
        window.LectureRapport.lire(buf).then(function (rap) {
          var nomRap = rap.conducteur.nom || "";
          carteAnalyse = { identification: { titulaire: nomRap, nom: nomRap.split(/\s+/).pop() || "" },
            periode: null, nbJours: 0, vehicules: [], evenements: [],
            anomalies: window.LectureRapport.anomalies(rap) };
          peindreCarte();
        }).catch(function (err) {
          cible.innerHTML = '<p class="vide">PDF illisible : ' + ech(err && err.message || err) + '</p>'; });
        return;
      }
      if (!window.LectureCarte) { cible.innerHTML = '<p class="vide">Le lecteur de carte n\'est pas disponible sur cette page.</p>'; return; }
      try {
        var carte = window.LectureCarte.lire(buf);
        carteAnalyse = window.LectureCarte.analyser(carte);
      } catch (err) {
        cible.innerHTML = '<p class="vide">Fichier illisible : ' + ech(err.message) + '</p>'; return;
      }
      peindreCarte();
    };
    fr.onerror = function () { cible.innerHTML = '<p class="vide">Le fichier n\'a pas pu être ouvert.</p>'; };
    fr.readAsArrayBuffer(f);
  });
  function peindreCarte() {
    var a = carteAnalyse, cible = document.getElementById("carte-resultat");
    if (!a) { cible.innerHTML = ""; return; }
    var id = a.identification || {};
    if (!id.titulaire && !a.nbJours && !a.evenements.length) {
      cible.innerHTML = '<p class="vide">Ce fichier ne ressemble pas à une carte de conducteur lisible (aucune identification ni activité).</p>'; return;
    }
    var match = CT.matchConducteur(a);
    var h = '<div class="doc ouvert">';
    h += '<div class="bloc-h2">Carte lue</div>';
    h += '<p>' + ech(id.titulaire || "titulaire non lu") +
      (id.numero ? '  ·  n° ' + ech(id.numero) : '') +
      (id.expiration ? '  ·  valable jusqu\'au ' + ech(id.expiration) : '') + '</p>';
    if (a.periode) h += '<p class="sous3">Activités du ' + ech(a.periode.du) + ' au ' + ech(a.periode.au) +
      ', ' + a.nbJours + ' jour' + (a.nbJours > 1 ? 's' : '') + '. Véhicules : ' + a.vehicules.length + '.</p>';

    h += '<div class="mini"><label>Rattacher au conducteur<select id="carte-cible">' +
      optionsConducteurs(match) + '</select></label>' +
      '<button id="carte-date">Porter la date de téléchargement</button></div>';
    h += '<span id="carte-msg" class="sous3"></span>';

    h += '<div class="bloc-h2">Anomalies tirées de la carte</div>';
    if (a.anomalies.length) {
      h += '<table class="ech"><thead><tr><th></th><th>Date</th><th>Type</th><th>Détail</th></tr></thead><tbody>';
      a.anomalies.forEach(function (x, i) {
        h += '<tr><td><input type="checkbox" class="ia" data-i="' + i + '" checked></td><td>' +
          ech(x.date) + '</td><td>' + ech(x.type) + '</td><td>' + ech(x.detail) + '</td></tr>';
      });
      h += '</tbody></table><div class="mini"><button id="carte-ajouter">Ajouter les anomalies cochées au suivi</button></div>';
    } else {
      h += '<p class="vide">Aucune anomalie tirée de la carte : ni dépassement calculé, ni événement enregistré par l\'appareil.</p>';
    }
    h += '</div>';
    cible.innerHTML = h;

    var bd = document.getElementById("carte-date");
    if (bd) bd.addEventListener("click", function () {
      var cid = document.getElementById("carte-cible").value;
      if (!cid) { msgCarte("Choisissez d'abord le conducteur."); return; }
      var d = a.periode ? a.periode.au : null;
      d = d || new Date().toISOString().slice(0, 10);
      CT.porterTelechargementCarte(cid, d);
      peindreEch();
      msgCarte("Date du téléchargement portée à l'échéancier (" + d + ").");
    });
    var ba = document.getElementById("carte-ajouter");
    if (ba) ba.addEventListener("click", function () {
      var cid = document.getElementById("carte-cible").value;
      if (!cid) { msgCarte("Choisissez d'abord le conducteur."); return; }
      var choisies = [];
      Array.prototype.forEach.call(document.querySelectorAll("#carte-resultat .ia:checked"), function (c) {
        choisies.push(a.anomalies[+c.getAttribute("data-i")]);
      });
      var n = CT.importerAnomalies(cid, choisies);
      peindreConducteurs(); reouvrir(cid);
      msgCarte(n + " anomalie" + (n > 1 ? "s" : "") + " ajoutée" + (n > 1 ? "s" : "") + " au suivi" +
        (function () { var r = CT.anomaliesRetenues(choisies).length, d = r - n, x = choisies.length - r;
          return (d > 0 ? " (" + d + " déjà présente" + (d > 1 ? "s" : "") + ")" : "") + "." +
            (x > 0 ? " " + x + " ligne" + (x > 1 ? "s" : "") + " non inscrite" + (x > 1 ? "s" : "") + " : faits techniques ou calculs indicatifs." : ""); })());
    });
  }
  function msgCarte(t) { var m = document.getElementById("carte-msg"); if (m) m.textContent = t; }

  /* rétroplanning */
  function peindreRetro() {
    var ds = document.getElementById("date-seance").value || null;
    var tb = document.getElementById("retro-corps"), h = '';
    CT.retroplanning(ds).forEach(function (e) {
      h += '<tr><td>' + ech(e.quoi) + '</td><td>' + ech(e.regle) + '</td><td>' + ech(e.date || "") + '</td></tr>';
    });
    tb.innerHTML = h;
  }
  peindreRetro();
  document.getElementById("date-seance").addEventListener("change", peindreRetro);
})();
</script>
