<!--
  CE QUE FAIT CET ÉCRAN, ET CE QU'IL A CESSÉ DE FAIRE.

  Il ouvrait sur « Ce niveau d'effectif est-il atteint depuis au moins douze
  mois consécutifs ? », puis seize à dix-huit questions d'orientation, avant
  tout questionnaire et tout document. Et le « non » à cette première question
  ne menait nulle part.

  Il ouvre maintenant sur la seule question qui vaille : avez-vous cette pièce,
  ce dispositif, ce process ? Une ligne par obligation que le module recense,
  deux boutons, et le « non » qui construit.

  OÙ MÈNE LE « NON », ET IL MÈNE TOUJOURS QUELQUE PART :

  - pour les obligations que le module rattachait à une procédure guidée, au
    parcours qui la fait naître, ouvert sur son document (parcours.html?p=…&faire=1) ;

  - pour celles qui n'avaient aucun parcours - elles étaient trente-cinq, et le
    « non » y tombait dans le vide -, au document lui-même, écrit ici à partir
    de la fiche d'entreprise : registre unique de sécurité, registre des
    dangers graves et imminents, fiche d'entreprise du service de santé au
    travail, plan de prévention, consigne de sécurité incendie, désignation du
    salarié compétent et du référent handicap, livret d'épargne salariale,
    information de l'inspection après un accident mortel, convention
    individuelle de forfait en jours. Celles qui ne sont pas un écrit - une
    durée maximale de travail, un repos quotidien, l'interdiction de
    discriminer - ne sont pas transformées en formulaire pour le plaisir
    d'avoir une pièce à sortir : elles restent au moteur.

  SUR « OUI », pour les documents écrits ici, on dépose l'existant : chaque
  mention exigée y est cherchée, celle qu'on n'y trouve pas sort rédigée, prête
  à insérer.

  CE QUI NE S'AFFICHE PAS : une obligation que la fiche d'entreprise rend non
  due. C'est l'effectif qui commande, comme partout dans l'application.

  LES TEXTES. Les documents écrits pour cet écran citent des articles lus au
  relais Légifrance le 7 septembre 2026, deux lectures concordantes, identifiant
  LEGIARTI porté sous chaque document. Le reste vient du moteur du module, où
  cent soixante-douze articles ont été lus à la source.

  Rien ne sort du poste.
-->

<script>
(function () {
  "use strict";
  var P = window.Pieces;
  var A = window.MoteurSocial && window.MoteurSocial.audit;
  var profil = window.Profil ? window.Profil.lire() : {};

  function dePiece(id, groupe) {
    var p = P.pour(id);
    if (!p) return null;
    return { id: p.id, groupe: groupe, question: p.question, titre: p.titre,
      piece: p, renvoi: p.renvoi, due: p.due };
  }

  var QUESTIONS = [
    dePiece("PIECE-REGISTRE-SECURITE", "Les pièces que vous devez tenir"),
    dePiece("PIECE-DGI", "Les pièces que vous devez tenir"),
    dePiece("PIECE-INCENDIE", "Les pièces que vous devez tenir"),
    dePiece("PIECE-FICHE-ENTREPRISE", "Les pièces que vous devez tenir"),
    dePiece("PIECE-SALARIE-COMPETENT", "Les pièces que vous devez tenir"),
    dePiece("PIECE-PLAN-PREVENTION", "Les pièces que vous devez tenir"),
    dePiece("PIECE-ACCIDENT-MORTEL", "Les pièces que vous devez tenir"),
    dePiece("PIECE-REFERENT-HANDICAP", "Les pièces que vous devez tenir"),
    dePiece("PIECE-LIVRET-EPARGNE", "Les pièces que vous devez tenir"),
    dePiece("PIECE-FORFAIT-JOURS", "Les pièces que vous devez tenir"),
  ].filter(Boolean);

  /* Les obligations du moteur qui ont une procédure guidée : le « non » y
     mène, ouverte sur son document. Celles que la fiche d'entreprise rend non
     dues ne sont pas posées ; celles dont l'assujettissement dépend d'une
     réponse que l'écran ne demande plus le sont, parce qu'un « peut-être » se
     tranche en ouvrant la pièce, pas en posant une question de plus. */
  if (A) {
    var ORDRE = ["instances", "documents obligatoires", "affichages et informations",
      "registres", "négociations", "santé-sécurité", "formation et entretiens",
      "congés et jours", "embauche et contrat", "fin du contrat",
      "égalité et non-discrimination", "épargne et protection sociale",
      "durée du travail et repos"];
    /* Une obligation déjà servie par une pièce écrite ici n'est pas reposée :
       la question serait la même, et la réponse mènerait à un parcours moins
       direct que le document. */
    var DEJA = { "SOC-AFF-CONSIGNE-INCENDIE": true, "SOC-SST-SALARIE-COMPETENT": true };
    var avecParcours = A.applicables(profil).filter(function (o) {
      return o.du !== false && !DEJA[o.id] && o.regularisation && o.regularisation.parcours;
    });
    avecParcours.sort(function (a, b) {
      var ia = ORDRE.indexOf(a.categorie), ib = ORDRE.indexOf(b.categorie);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    avecParcours.forEach(function (o) {
      /* Le document unique a son écran, où il s'écrit par métier : c'est là
         qu'il faut aller, pas dans un parcours qui le décrit. */
      var duerp = o.id === "SOC-DOC-DUERP";
      QUESTIONS.push({
        id: o.id,
        groupe: o.categorie.charAt(0).toUpperCase() + o.categorie.slice(1),
        question: o.intitule,
        titre: duerp ? "Document unique" : o.regularisation.parcoursNom,
        lien: duerp ? "controler-duerp.html"
                    : "parcours.html?p=" + o.regularisation.parcours + "&faire=1",
        lienOui: duerp ? "controler-duerp.html" : null,
        renvoi: o.fondement || "",
      });
    });
  }

  window.EcranPieces.demarrer({
    racine: "ecran",
    module: "social",
    titre: "Avez-vous ces documents et ces dispositifs ?",
    questions: QUESTIONS,
    pied: "Les documents écrits ici portent leurs articles, avec l'identifiant de version, " +
      "sous la feuille. Tout est écrit dans ce navigateur : aucune donnée ne part sur un " +
      "réseau. La santé-sécurité a son écran, <a href=\"audit-sst.html\">ici</a>, et le " +
      "document unique le sien, <a href=\"controler-duerp.html\">là</a>.",
  });
})();
</script>
<script>
  if ("serviceWorker" in navigator)
