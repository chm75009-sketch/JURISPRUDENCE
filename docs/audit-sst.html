<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="manifest-audit-sst.json">
<link rel="apple-touch-icon" href="icons/icon-sst-180.png">

<title>Santé et sécurité</title>
<meta name="description" content="Une question par pièce. Sur « non », le document est déjà écrit.">
<!-- Équipe, droits et journal : le point unique d'autorisation. Chargé avant
     tout le reste, il masque la page tant que l'utilisateur n'est pas identifié.
     Tant qu'aucun utilisateur n'a été créé, il ne fait rien. Voir docs/DROITS.md. -->
<script src="droits.js"></script>

<!--
  UNE LIGNE PAR QUESTION, OUI OU NON. Rien d'autre.

  Sur « non », le document s'affiche déjà écrit à partir de la fiche
  d'entreprise ; ce que l'application ne peut pas connaître se saisit à côté
  du document et chaque frappe le réécrit. Sur « oui », on dépose le document
  existant et ce qui manque en sort rédigé.

  Ce qui n'est pas dû à l'effectif n'est pas demandé : commission
  santé-sécurité en dessous de trois cents salariés, registre des dangers
  graves et imminents, consultation et référent du comité en dessous de onze,
  référent harcèlement de l'employeur en dessous de deux cent cinquante.

  Le document unique a ses deux écrans : duerp.html sur « non », le document
  écrit ; controler-duerp.html sur « oui », le dépôt et le contrôle.

  Les articles des pièces écrites pour cet écran ont été lus au relais
  Légifrance le 7 septembre 2026, deux lectures concordantes, identifiant de
  version porté sous chaque document et repris dans docs/documents-sst.js.
  Rien ne sort du poste.
-->
<link rel="stylesheet" href="style.css">
<style>
  /* La liste, au plus près de la maquette : pas de rappel, pas de titre, pas
     de pied ; une ligne par question avec un filet dessous, Oui vert, Non
     bleu. Les documents ouverts sur « non » gardent l'habillage du moteur. */
  #ecran>.rappel,#ecran>h2.q,#ecran>footer{display:none}
  #ecran>.ligne{border:0;border-bottom:1px solid var(--filet);border-radius:0;background:none;
    padding:14px 0;margin:0;min-height:var(--h-ligne)}
  #ecran>.ligne.repondue{border-left:0;background:var(--vert-clair);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:var(--r1)}
  #ecran>.ligne .t{font:400 17px/1.3 system-ui}
  #ecran>.ligne .b button{font:600 17px/1 system-ui;min-width:74px;min-height:46px;padding:0 12px;border-radius:var(--r1)}
  #ecran>.ligne .b [data-oui]{border:2px solid var(--vert);background:var(--vert-clair);color:var(--vert)}
  #ecran>.ligne .b [data-oui]:hover{background:var(--vert);color:#fff}
  #ecran>.ligne .b [data-non]{border:2px solid var(--accent);background:var(--accent);color:#fff}
  #ecran>.groupe{margin:14px 0 0;color:var(--texte-2)}
  @media (max-width:640px){#ecran>.ligne .b button{min-width:64px;padding:0 10px;font-size:16px}}
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <p class="marque">Santé et sécurité</p>
    <div class="outils">
      <a href="index.html">Accueil</a>
    </div>
  </div>
</header>

<main class="wrap"><div id="ecran"></div></main>

<script src="profil.js"></script>
<script src="audit-export.js"></script>
<script src="documents-produits.js"></script>
<script src="documents-sst.js"></script>
<script src="documents-sst-2.js"></script>
<script>
(function () {
  "use strict";
  var P = window.Pieces;

  /* L'effectif décide de ce qui s'affiche. Inconnu, il ne décide rien : la
     question se pose, et le document dit lui-même les deux branches.

     LES TROIS SEUILS QUI FILTRENT CET ÉCRAN, lus au relais Légifrance le
     7 septembre 2026, deux lectures concordantes :

     - onze salariés, L. 2311-2 (LEGIARTI000035609353) : « Un comité social et
       économique est mis en place dans les entreprises d'au moins onze
       salariés. Sa mise en place n'est obligatoire que si l'effectif d'au
       moins onze salariés est atteint pendant douze mois consécutifs. » Les
       questions qui supposent un comité - sa consultation sur le document
       unique, la formation de ses élus, son référent harcèlement - ne se
       posent donc pas en dessous. La condition des douze mois consécutifs,
       elle, n'est pas vérifiée ici : la fiche d'entreprise ne porte que
       l'effectif du jour ;

     - deux cent cinquante salariés, L. 1153-5-1 (LEGIARTI000037380160) :
       « Dans toute entreprise employant au moins deux cent cinquante salariés
       est désigné un référent chargé d'orienter, d'informer et d'accompagner
       les salariés en matière de lutte contre le harcèlement sexuel et les
       agissements sexistes » ;

     - trois cents salariés, L. 2315-36 (LEGIARTI000035626455) : la commission
       santé, sécurité et conditions de travail est créée dans les entreprises
       d'au moins trois cents salariés, les établissements distincts d'au moins
       trois cents salariés et les établissements mentionnés aux articles
       L. 4521-1 et suivants. CE QUE L'ÉCRAN NE VOIT PAS : le troisième cas.
       La fiche d'entreprise ne dit pas si un établissement relève de
       L. 4521-1, et la question ne se pose donc pas en dessous de trois cents
       salariés alors que la commission peut y être due. Elle se pose en
       revanche dès que l'effectif est inconnu. */
  function effectif(profil) {
    var v = (profil || {}).effectif;
    if (v === undefined || v === null || String(v).trim() === "") return null;
    var n = Number(v);
    return isFinite(n) ? n : null;
  }
  function auMoins(n) {
    return function (profil) {
      var e = effectif(profil);
      return e === null ? null : e >= n;
    };
  }

  /* Une question portée par une pièce écrite pour cet écran. */
  function dePiece(id, groupe) {
    var p = P.pour(id);
    return { id: p.id, groupe: groupe, question: p.question, titre: p.titre,
      piece: p, renvoi: p.renvoi, due: p.due };
  }
  /* Une question portée par un document que le module écrivait déjà : le
     générateur rend du texte, l'écran le rend en feuille corrigeable. */
  function deTexte(id, question, titre, groupe, due) {
    return { id: id, groupe: groupe, question: question, titre: titre,
      texteId: id, due: due,
      renvoi: "Sources du module santé-sécurité : moteur/sst/textes-sst.json, " +
        "trente-cinq articles lus à la source avec leur identifiant de version." };
  }

  var QUESTIONS = [
    /* Le document unique a ses deux écrans : le « non » ouvre le document
       écrit, le « oui » le contrôle. */
    { id: "duerp", groupe: "Le document unique",
      question: "Avez-vous un document unique d'évaluation des risques ?",
      titre: "Document unique",
      lien: "duerp.html", lienOui: "controler-duerp.html" },

    deTexte("SST-CTL-DUE-05",
      "Avez-vous le programme annuel de prévention, ou la liste des actions consignée dans le document unique ?",
      "Programme annuel de prévention", "Le document unique"),
    deTexte("SST-CTL-DUE-06",
      "L'avis indiquant les modalités d'accès au document unique est-il affiché ?",
      "Avis d'accès et conservation des versions", "Le document unique"),
    deTexte("SST-CTL-DUE-07",
      "Le comité social et économique est-il consulté sur le document unique ?",
      "Consultation du comité sur le document unique", "Le document unique", auMoins(11)),
    deTexte("SST-CTL-DUE-08",
      "Le document unique est-il transmis au service de prévention et de santé au travail ?",
      "Transmission au service de santé au travail", "Le document unique"),

    dePiece("PIECE-INCENDIE", "Les pièces de la prévention"),
    dePiece("PIECE-DGI", "Les pièces de la prévention"),
    dePiece("PIECE-REGISTRE-SECURITE", "Les pièces de la prévention"),
    dePiece("PIECE-FICHE-ENTREPRISE", "Les pièces de la prévention"),
    dePiece("PIECE-SALARIE-COMPETENT", "Les pièces de la prévention"),
    dePiece("PIECE-PLAN-PREVENTION", "Les pièces de la prévention"),
    dePiece("PIECE-ACCIDENT-MORTEL", "Les pièces de la prévention"),

    deTexte("SST-CTL-CSS-01",
      "La commission santé, sécurité et conditions de travail est-elle créée ?",
      "Commission santé, sécurité et conditions de travail", "La commission", auMoins(300)),
    deTexte("SST-CTL-CSS-05",
      "Les élus et le référent ont-ils suivi la formation santé, sécurité et conditions de travail ?",
      "Formation santé, sécurité et conditions de travail", "La commission", auMoins(11)),

    deTexte("SST-CTL-HAR-01",
      "Avez-vous désigné le référent harcèlement sexuel de l'employeur ?",
      "Référent harcèlement de l'employeur", "Le harcèlement", auMoins(250)),
    deTexte("SST-CTL-HAR-02",
      "Le comité a-t-il désigné son référent en matière de harcèlement sexuel ?",
      "Référent harcèlement du comité", "Le harcèlement", auMoins(11)),
    deTexte("SST-CTL-HAR-03",
      "L'information sur les harcèlements est-elle affichée dans vos locaux ?",
      "Affichage et information sur les harcèlements", "Le harcèlement"),
    deTexte("SST-CTL-HAR-04",
      "Avez-vous une procédure interne de signalement du harcèlement ?",
      "Prévention du harcèlement et procédure de signalement", "Le harcèlement"),
  ];

  window.EcranPieces.demarrer({
    racine: "ecran",
    module: "sst",
    titre: "Avez-vous ces pièces ?",
    questions: QUESTIONS,
    pied: "",
  });
})();
</script>
<script>
  /* L'installation sur l'écran d'accueil suppose un service worker enregistré.
     Le même sert toutes les pages : il est à la racine du site. */
  if ("serviceWorker" in navigator)
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
</script>
<script src="assistant.js" defer></script>
</body>
</html>
