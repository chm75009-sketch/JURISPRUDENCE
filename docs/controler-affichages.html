<!--
  LE DÉPÔT OU L'AFFICHE EN PREMIER. Rien avant.

  Depuis « Oui » à l'audit (j'ai mes affichages), la page ouvre sur le dépôt :
  le texte des affiches en place (Word ou texte), un bouton Contrôler. Chaque
  mention que la loi impose y est cherchée ; ce qui manque ouvre l'affiche,
  entièrement rédigée, remplie avec la fiche d'entreprise, prête à imprimer.

  Depuis « Non » (controler-affichages.html?depart=non), la page ouvre sur les
  onze affiches, les unes sous les autres : les quelques cases à compléter en
  tête de chacune, la feuille dessous, Imprimer et Télécharger en Word.

  Depuis « Oui » (?depart=oui), elle ouvre le relevé : les onze affiches à
  cocher, chacune avec son emplacement, sa date de pose et sa photographie
  datée. Le dépôt d'un texte d'affichages reste accessible, mais il n'est plus
  la porte d'entrée du « oui ».

  Une affiche seule à l'écran : ses champs en tête, la feuille, Imprimer,
  Télécharger en Word, et le texte qui l'appelle sous un repli. Le bouton
  Retour du bandeau, posé par droits.js, revient à l'écran précédent.

  CE QUI EST REPRODUIT MOT POUR MOT. Les articles 225-1 à 225-4, 222-33 et
  222-33-2 du code pénal, et les articles L. 3221-1 à L. 3221-7 du code du
  travail, figurent en toutes lettres sur les affiches qui les appellent :
  L. 1142-6, L. 1152-4, L. 1153-5 et R. 3221-2 imposent le texte, pas un
  résumé. Ils ont été lus à la source le 7 septembre 2026, trois lectures
  concordantes chacun, et leur identifiant de version est porté sous chaque
  encadré. Un texte que l'on n'a pas lu ne s'écrit pas de mémoire.

  CE QUI N'EST PAS CITÉ, ET POURQUOI. L'affiche « interdiction de fumer et de
  vapoter » ne cite aucun article : le texte qui impose cette signalisation
  relève du code de la santé publique, que le relais de vérification de cette
  application ne sert pas. L'affiche existe et se pose ; elle ne se réclame
  d'aucun texte que cette page aurait lu.

  Rien ne sort de ce poste. Les coordonnées saisies restent dans le navigateur.
-->

<style>
  main.wrap{max-width:560px;padding-bottom:var(--e7)}
  main.wrap.large{max-width:760px}
  .rappel-fiche{margin:14px 0 0;font-size:var(--t2);color:var(--texte-2)}
  .champs{margin:14px 0 0}
  .champs label.ch.plein>.nom{color:var(--vert)}
  textarea.depot{min-height:200px;margin:14px 0 0;font:16px/1.5 system-ui}
  #lecture{margin:14px 0 0}
  .barre{margin:14px 0 0}
  details.loi{margin:var(--e2) 0 var(--e5)}
  details.loi .c{font-size:var(--t2);line-height:1.5;color:var(--texte-2);padding:0 0 var(--e3)}
  .suite{margin:var(--e5) 0 0}
  button.doc-ligne{width:100%;border:0;border-bottom:1px solid var(--filet);border-radius:0;background:none;
    color:var(--encre);font:400 18px/1.3 system-ui;text-align:left;justify-content:space-between;min-height:52px;padding:14px 0}
  button.doc-ligne:hover{background:var(--creux);color:var(--accent);border-color:var(--filet)}

  /* Le résultat du contrôle : une carte par affiche, trouvée ou non. */
  .manque{border:1px solid var(--filet);border-left:4px solid var(--ambre);
    border-radius:0 var(--r2) var(--r2) 0;background:var(--surface);padding:12px 14px;margin:0 0 var(--e2)}
  .manque.trouve{border-left-color:var(--vert)}
  .manque .o{font:600 15px/1.35 system-ui;color:var(--encre)}
  .manque q{color:var(--encre)}
  .manque .barre{margin:10px 0 0}

  /* L'affiche, à l'écran : une feuille pleine largeur, lisible sur un
     téléphone. Le format A4 n'est pris qu'à l'impression. */
  .titre-affiche{font:600 var(--t5)/1.3 system-ui;margin:var(--e5) 0 0}
  .a4{background:#fff;color:#000;padding:20px 16px;margin:14px 0 0;border:1px solid var(--filet);
    border-radius:var(--r2);font:16px/1.5 Georgia,"Times New Roman",serif}
  .a4 .ent{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid #000;
    padding-bottom:6px;font:600 13px/1.3 system-ui;text-transform:uppercase;letter-spacing:.06em}
  .a4 h1{font:700 24px/1.15 system-ui;margin:22px 0 4px;letter-spacing:-.01em;text-align:center}
  .a4 .sous{text-align:center;font:600 14px/1.4 system-ui;color:#333;margin:0 0 18px}
  .a4 h2{font:700 16px/1.3 system-ui;margin:18px 0 6px;border-bottom:1px solid #999;padding-bottom:2px}
  .a4 p{margin:0 0 8px}
  .a4 .gros{font:700 20px/1.35 system-ui;margin:6px 0}
  .a4 .cle{display:grid;grid-template-columns:1fr;gap:2px;margin:0 0 8px;font-size:16px}
  .a4 .cle span:first-child{font:600 12.5px/1.5 system-ui;text-transform:uppercase;letter-spacing:.04em;color:#333}
  .a4 ul{margin:0 0 8px;padding-left:20px}
  .a4 li{margin:0 0 4px}
  .a4 .vide{color:#666;font-style:italic}
  .a4 .loi{border-left:3px solid #000;padding:6px 0 6px 12px;margin:0 0 12px;font-size:14px;line-height:1.45}
  .a4 .loi b{display:block;font:700 14px/1.4 system-ui;margin-bottom:4px}
  .a4 .loi .ref{display:block;margin-top:4px;font:400 12px/1.3 system-ui;color:#555}
  .a4 .note{font-size:13.5px;color:#444;margin:0 0 8px}
  .a4 .pied{margin-top:20px;border-top:1px solid #999;padding-top:8px;
    font:400 13px/1.5 system-ui;color:#333;display:grid;grid-template-columns:1fr;gap:8px}
  .a4 .signature{margin-top:18px;min-height:60px;border:1px dashed #aaa;border-radius:6px;padding:6px 8px;
    font:400 13px/1.4 system-ui;color:#555}
  @media (min-width:700px){
    .a4{padding:32px 30px}
    .a4 .cle{grid-template-columns:220px 1fr;gap:12px}
    .a4 .pied{grid-template-columns:1fr 1fr;gap:20px}
  }

  /* Le relevé : une ligne par affichage, sur une carte. */
  .releve-ligne{border-bottom:1px solid var(--filet);padding:10px 0}
  .releve-ligne .n{font:600 15px/1.35 system-ui}
  /* La case se prend au doigt : la cible fait 44 px de haut, le libellé
     s'aligne sur la case et revient à la ligne sans passer sous elle. */
  .releve-ligne .coche{display:flex;align-items:flex-start;gap:10px;min-height:44px;
    cursor:pointer;padding:2px 0}
  .releve-ligne .coche input{width:22px;height:22px;min-height:0;flex:0 0 auto;margin:2px 0 0}
  .releve-ligne .e{font-size:var(--t1);color:var(--texte-2);margin:2px 0 6px}
  .releve-ligne .e.fait{color:var(--vert)}
  .releve-ligne .deux{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .releve-ligne input{font-size:15px;padding:8px 10px;min-height:40px}
  .releve-ligne .photo{margin:8px 0 0}
  .releve-ligne .pj{display:inline-flex;flex-direction:column;gap:4px;font-size:13.5px;
    color:var(--texte-2);width:100%}
  .releve-ligne .pj input[type=file]{min-height:0;padding:6px 0;font-size:13.5px;width:100%}
  .releve-ligne .pj-dit{display:block;margin:4px 0 0;font-size:13px;color:var(--texte-3)}

  @page{size:A4;margin:14mm}
  @media print{
    header.site,.barre,.champs,details,.rappel-fiche,.suite,.titre-affiche,.manque,textarea,#lecture,h2{display:none !important}
    .releve-ligne .pj{display:none !important}
    /* À l'impression, la case n'a plus d'objet : le relevé imprimé porte
       « en place » ou « à poser », qui se lit. Le 28 septembre 2026. */
    .releve-ligne .coche input{display:none !important}
    .releve-ligne .coche{min-height:0;padding:0}
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    .a4{border:0;border-radius:0;margin:0;padding:0;page-break-after:always;font-size:12pt}
    .a4 .cle{grid-template-columns:62mm 1fr;gap:4mm}
    .a4 .pied{grid-template-columns:1fr 1fr}
    .hors-impression{display:none !important}
    [hidden]{display:none !important}
  }
</style>

<header class="site">
  <div class="wrap">
    <p class="marque">Affichages obligatoires</p>
    <div class="outils">
      <a href="index.html">Accueil</a>
    </div>
  </div>
</header>

<main class="wrap" id="main">

  <!-- ══════ LE DÉPÔT ══════ -->
  <section id="e-depot" hidden>
    <p class="rappel-fiche" id="rappel-depot"></p>
    <div class="barre pile">
      <label class="btn second" style="display:inline-flex;align-items:center;justify-content:center;gap:9px">Choisir le fichier (.docx, .pdf ou .txt)
        <input type="file" id="fichier" accept=".docx,.txt,text/plain,.pdf,application/pdf" style="display:none"></label>
    </div>
    <div id="lecture"></div>
    <textarea class="depot" id="depot" placeholder="Ou collez ici le texte de vos affichages."></textarea>
    <div class="barre pile"><button type="button" class="btn" id="controler">Contrôler</button></div>
    <div id="diagnostic"></div>
    <div class="suite">
      <button type="button" class="doc-ligne" data-va="toutes">Les onze affiches, prêtes à poser</button>
      <button type="button" class="doc-ligne" data-va="releve">Le relevé daté</button>
    </div>
  </section>

  <!-- ══════ UNE AFFICHE, SEULE ══════ -->
  <section id="e-affiche" hidden>
    <div id="affiche-seule"></div>
  </section>

  <!-- ══════ LES ONZE AFFICHES ══════ -->
  <section id="e-toutes" hidden>
    <p class="rappel-fiche" id="rappel-toutes"></p>
    <div class="barre pile">
      <button type="button" class="btn" id="imprimer-tout">Imprimer toutes les affiches</button>
      <button type="button" class="btn second" id="word-tout">Télécharger en Word</button>
    </div>
    <details class="loi"><summary>L'entreprise, en tête de chaque affiche</summary>
      <div class="champs" id="champs-entreprise"></div></details>
    <div id="affiches"></div>
    <div class="suite">
      <button type="button" class="doc-ligne" data-va="releve">Le relevé daté</button>
    </div>
  </section>

  <!-- ══════ LE RELEVÉ ══════ -->
  <section id="e-releve" hidden>
    <div class="champs" id="champs-releve"></div>
    <div id="releve"></div>
    <div class="barre pile">
      <button type="button" class="btn" id="imprimer-releve">Imprimer le relevé</button>
      <button type="button" class="btn second" id="word-releve">Télécharger en Word</button>
    </div>
  </section>

  <p class="reserve">Contrôle documentaire automatisé : le résultat est indicatif et ne vaut ni avis juridique ni attestation de conformité.</p>
</main>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var ech = function (s) { return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); };

  /* ------------------------------------------------------------------ */
  /* LES TEXTES, LUS À LA SOURCE LE 7 SEPTEMBRE 2026.

     Trois lectures espacées par article, identifiant de version stable aux
     trois lectures, réponse « elargi » à faux sur la lecture retenue. Le
     relais rend parfois un homonyme d'un autre code : c'est le contenu qui
     tranche, et chacun de ces textes parle bien de ce pour quoi il est cité. */
  var LU = "lu le 7 septembre 2026";

  /* Les articles du code pénal vivent dans textes-penal.js : l'écran et les
     documents du parcours y puisent tous les deux, depuis le 29 septembre
     2026, faute de quoi l'un les reproduisait et l'autre laissait un crochet. */
  var CP = (window.TextesPenal && window.TextesPenal.CP) || {};

  var CT = {
    "L3221-1": { id: "LEGIARTI000006902817", t: "Les dispositions des articles L. 3221-2 à L. 3221-7 sont applicables, outre aux employeurs et salariés mentionnés à l'article L. 3211-1, à ceux non régis par le code du travail et, notamment, aux agents de droit public." },
    "L3221-2": { id: "LEGIARTI000006902818", t: "Tout employeur assure, pour un même travail ou pour un travail de valeur égale, l'égalité de rémunération entre les femmes et les hommes." },
    "L3221-3": { id: "LEGIARTI000006902819", t: "Constitue une rémunération au sens du présent chapitre, le salaire ou traitement ordinaire de base ou minimum et tous les autres avantages et accessoires payés, directement ou indirectement, en espèces ou en nature, par l'employeur au salarié en raison de l'emploi de ce dernier." },
    "L3221-4": { id: "LEGIARTI000006902820", t: "Sont considérés comme ayant une valeur égale, les travaux qui exigent des salariés un ensemble comparable de connaissances professionnelles consacrées par un titre, un diplôme ou une pratique professionnelle, de capacités découlant de l'expérience acquise, de responsabilités et de charge physique ou nerveuse." },
    "L3221-5": { id: "LEGIARTI000006902821", t: "Les disparités de rémunération entre les établissements d'une même entreprise ne peuvent pas, pour un même travail ou pour un travail de valeur égale, être fondées sur l'appartenance des salariés de ces établissements à l'un ou l'autre sexe." },
    "L3221-6": { id: "LEGIARTI000037389671", t: "Les différents éléments composant la rémunération sont établis selon des normes identiques pour les femmes et pour les hommes. Les catégories et les critères de classification et de promotion professionnelles ainsi que toutes les autres bases de calcul de la rémunération, notamment les modes d'évaluation des emplois, sont établis selon des règles qui assurent l'application du principe fixé à l'article L. 3221-2." },
    "L3221-7": { id: "LEGIARTI000006902825", t: "Est nulle de plein droit toute disposition figurant notamment dans un contrat de travail, une convention ou accord collectif de travail, un accord de salaires, un règlement ou barème de salaires résultant d'une décision d'un employeur ou d'un groupement d'employeurs et qui, contrairement aux articles L. 3221-2 à L. 3221-6, comporte, pour un ou des salariés de l'un des deux sexes, une rémunération inférieure à celle de salariés de l'autre sexe pour un même travail ou un travail de valeur égale. La rémunération plus élevée dont bénéficient ces derniers salariés est substituée de plein droit à celle que comportait la disposition entachée de nullité." },
    "L1142-2-1": { id: "LEGIARTI000031072447", t: "Nul ne doit subir d'agissement sexiste, défini comme tout agissement lié au sexe d'une personne, ayant pour objet ou pour effet de porter atteinte à sa dignité ou de créer un environnement intimidant, hostile, dégradant, humiliant ou offensant." },
  };

  /* Les fondements de chaque affiche, avec leur identifiant de version. Ils
     s'impriment en pied de feuille : celui qui décroche l'affiche sait de quoi
     elle se réclame. */
  var FOND = {
    "D. 4711-1": "LEGIARTI000018527636",
    "L. 3171-1": "LEGIARTI000033021067",
    "D. 3171-2": "LEGIARTI000018533984",
    "D. 3171-3": "LEGIARTI000018533982",
    /* Le double préalable à l'inspection, ajouté le 28 septembre 2026. */
    "D. 3171-4": "LEGIARTI000043128637",
    "L. 3141-16": "LEGIARTI000035652687",
    "D. 3141-5": "LEGIARTI000033515945",
    "D. 3141-6": "LEGIARTI000033515942",
    "L. 1142-6": "LEGIARTI000029144893",
    "R. 3221-2": "LEGIARTI000033292519",
    "L. 1142-2-1": "LEGIARTI000031072447",
    "L. 1152-4": "LEGIARTI000029144897",
    "L. 1153-5": "LEGIARTI000037389712",
    "L. 1153-5-1": "LEGIARTI000037380160",
    "L. 2314-1": "LEGIARTI000037389707",
    "R. 2262-1": "LEGIARTI000048288541",
    "R. 2262-3": "LEGIARTI000033292505",
    "R. 2262-5": "LEGIARTI000018535589",
    "R. 4121-4": "LEGIARTI000045386451",
    /* LA CONSIGNE INCENDIE CITAIT SES DEUX ARTICLES SANS LEUR IDENTIFIANT.

       « Fondement : R. 4227-38 du code du travail (undefined, lu le
       7 septembre 2026) » : les deux numéros n'étaient pas dans cette table,
       et le mot « undefined » partait sur l'affiche. Relevé le 29 septembre
       2026. Les deux identifiants sont lus au relais le même jour, deux
       lectures concordantes chacun : R. 4227-38 « La consigne de sécurité
       incendie indique : 1° Le matériel d'extinction et de secours… » et
       R. 4227-39 « La consigne de sécurité incendie prévoit des essais et
       visites périodiques du matériel… ». */
    "R. 4227-38": "LEGIARTI000024769384",
    "R. 4227-39": "LEGIARTI000024769386",
  };
  /* La date de lecture n'est pas la même pour tous : celle du bas de page vaut
     pour les articles lus le 7 septembre, et un article lu plus tard porte sa
     propre date. Dire « lu le 7 septembre » d'un texte lu le 29 serait une
     lecture qu'on n'a pas faite. */
  var LU_PAR = {
    "R. 4227-38": "lu le 29 septembre 2026",
    "R. 4227-39": "lu le 29 septembre 2026",
  };
  /* Un numéro absent de la table ne s'écrit plus « undefined » : il s'écrit
     sans identifiant, et verifier-affiches.mjs refuse un fondement sans
     identifiant de version. */
  function ident(x) { return FOND[x] || ""; }
  function citer(x) {
    var id = ident(x);
    return x + " du code du travail" + (id ? " (" + id + ", " + (LU_PAR[x] || LU) + ")" : "");
  }

  /* ------------------------------------------------------------------ */
  /* L'état de la page : les onze cases et les coordonnées saisies. */
  var CLE = "controler-affichages";
  var E = (function () {
    try { return JSON.parse(localStorage.getItem(CLE) || "null") || {}; } catch (_) { return {}; }
  })();
  E.faites = E.faites || {};
  E.v = E.v || {};
  function garder() { try { localStorage.setItem(CLE, JSON.stringify(E)); } catch (_) {} }

  var P = (window.Profil && window.Profil.lire) ? window.Profil.lire() : {};
  function depuisProfil(cle, valeur) { if (!E.v[cle] && valeur) E.v[cle] = String(valeur); }
  depuisProfil("denomination", P.denomination || P.entreprise);
  depuisProfil("adresse", P.adresse);
  depuisProfil("siret", P.siret);
  depuisProfil("responsable", P.responsable);
  depuisProfil("ccnIntitule", P.conventionCollective);
  /* CE QUE LA FICHE SAIT NE SE REDEMANDE PAS, ET NE SORT PAS ENTRE CROCHETS.
     Les affiches portaient « [ unité de contrôle à indiquer ] » et « [ nom du
     service à indiquer ] » alors que la fiche d'entreprise a le bloc
     « organismes et interlocuteurs », qui promet d'être repris dans les
     documents. Relevé le 26 septembre 2026. */
  /* LE NOM ET L'ADRESSE SONT DEUX CASES, LA FICHE N'EN A QU'UNE.

     La fiche enregistre « Unité de contrôle 95-02, 13 boulevard Gambetta,
     95100 Argenteuil » d'un seul tenant. L'affiche recopiait le tout dans
     « Unité de contrôle » et laissait « ADRESSE [ adresse à indiquer ] » juste
     en dessous, sous l'adresse déjà écrite. Relevé le 29 septembre 2026. On
     coupe donc au premier morceau qui ressemble à une adresse, c'est-à-dire
     qui commence par un numéro de voie ou qui porte un code postal ; à défaut,
     rien n'est coupé et la case garde tout, comme avant. */
  function couperAdresse(v) {
    var t = String(v || "").trim();
    if (!t) return null;
    var bouts = t.split(",");
    for (var i = 1; i < bouts.length; i++) {
      var reste = bouts.slice(i).join(",").trim();
      if (/^\d+\s*(bis|ter)?\s+\S/i.test(reste) || /\b\d{5}\b/.test(bouts[i])) {
        var nom = bouts.slice(0, i).join(",").trim();
        if (nom) return { nom: nom, adresse: reste };
      }
    }
    return null;
  }
  (function () {
    var d = couperAdresse(P.orgInspection);
    depuisProfil("inspUnite", d ? d.nom : P.orgInspection);
    if (d) depuisProfil("inspAdresse", d.adresse);
    var s2 = couperAdresse(P.orgSanteTravail);
    depuisProfil("spstNom", s2 ? s2.nom : P.orgSanteTravail);
    if (s2) depuisProfil("spstAdresse", s2.adresse);
  })();
  /* LE NUMÉRO IDCC EST DANS L'INTITULÉ DE LA CONVENTION.

     L'affiche de la convention collective sortait « NUMÉRO IDCC [ numéro à
     indiquer ] » alors que la fiche porte « 0016 - transports routiers » : les
     quatre chiffres sont devant. Corrigé le 28 septembre 2026 sur la
     contre-vérification du 26. L'intitulé, lui, garde sa forme complète. */
  (function () {
    var m = /(?:^|\D)(\d{4})(?:\D|$)/.exec(String(P.conventionCollective || ""));
    if (m) depuisProfil("ccnIdcc", m[1]);
  })();
  /* LE DÉFENSEUR DES DROITS NE SE RECOPIE PAS À LA MAIN.

  /* CE QUE LE CONTRÔLE CHERCHE DANS LE TEXTE DÉPOSÉ.

     Une entrée par affiche, avec les mots qui disent que le sujet est
     traité. Ils viennent des textes cités sous chaque affiche (« pourquoi »),
     pas d'ailleurs : D. 4711-1 pour les coordonnées, L. 3171-1 pour
     l'horaire, L. 3141-16 et D. 3141-5 pour les congés, L. 1142-6 et
     R. 3221-2 pour les textes d'égalité et de non-discrimination, L. 1153-5
     et L. 1152-4 pour les textes du harcèlement, R. 2262-3 pour la
     convention, R. 4121-4 pour l'accès au document unique. Un mot trouvé dit
     que le sujet est là, jamais qu'il est bien traité. */
  var ATTENDUS = {
    /* D. 4711-1 DEMANDE TROIS CHOSES, ET LE MOT-CLÉ N'EN CHERCHAIT QU'UNE.

       « L'employeur affiche, dans des locaux normalement accessibles aux
       travailleurs, l'adresse et le numéro d'appel : 1° Du médecin du travail
       ou du service de santé au travail compétent pour l'établissement ;
       2° Des services de secours d'urgence ; 3° De l'inspection du travail
       compétente ainsi que le nom de l'inspecteur compétent »
       (D. 4711-1, LEGIARTI000018527636, lu au relais le 29 septembre 2026,
       deux lectures concordantes).

       Le contrôle se contentait de trouver les mots « inspection du travail »
       et concluait « Trouvé dans votre texte » sur un texte qui ne portait ni
       adresse, ni numéro, ni nom d'agent. Relevé le 29 septembre 2026, comme
       pour la consigne incendie le 26. Chaque élément est cherché à part :
       l'adresse par un code postal, le numéro par une suite de chiffres
       groupés, le nom par une civilité. Ce sont des indices, pas des preuves,
       et la ligne le dit déjà : « la recherche voit que le sujet est traité,
       elle ne dit jamais qu'il l'est bien ». */
    inspection: [
      { objet: "L'inspection du travail compétente est nommée",
        mots: ["inspection du travail", "inspecteur du travail", "unite de controle",
               "unité de contrôle", "ddets", "direccte", "dreets"] },
      { objet: "Son adresse (D. 4711-1, 3°)", ou: "adresse" },
      { objet: "Son numéro d'appel (D. 4711-1, 3°)", ou: "telephone" },
      { objet: "Le nom de l'inspecteur compétent (D. 4711-1, 3°)", ou: "personne" },

    spst: [

        mots: ["médecin du travail", "santé au travail", "medecin du travail",
               "sante au travail", "spst"] },
      { objet: "Son adresse (D. 4711-1, 1°)", ou: "adresse" },
      { objet: "Son numéro d'appel (D. 4711-1, 1°)", ou: "telephone" },
    ],
    secours: [

      pos += 46 + lnom + lextra + lcom;
    }
    throw new Error("Le fichier ne contient pas de document Word (word/document.xml).");
  }
  function inflater(u8) {
    if (typeof DecompressionStream !== "function")
      return Promise.reject(new Error("Ce navigateur ne sait pas décomprimer le fichier. Collez le texte à la place."));
    return new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
  }
  function texteDeXml(xml) {
    return xml.replace(/<w:tab[^>]*\/>/g, "\t").replace(/<w:br[^>]*\/>/g, "\n")
      .replace(/<\/w:p>/g, "\n").replace(/<[^>]+>/g, "")
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
      .replace(/&apos;/g, "'").replace(/&amp;/g, "&").replace(/\n{3,}/g, "\n\n").trim();
  }
  function lireDocx(fichier) {
    return fichier.arrayBuffer().then(function (buf) {
      var e = entreeZip(buf, "word/document.xml");
      if (e.methode === 0) return new TextDecoder("utf-8").decode(e.data);
      if (e.methode !== 8) throw new Error("Compression inconnue dans ce .docx.");
      return inflater(e.data).then(function (b) { return new TextDecoder("utf-8").decode(new Uint8Array(b)); });
    }).then(texteDeXml);
  }

  $("#fichier").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var dit = function (m, c) { $("#lecture").innerHTML = '<div class="avis ' + (c || "info") + '">' + m + "</div>"; };
    dit("Lecture de <b>" + ech(f.name) + "</b>…");
    ((window.LirePdf && window.LirePdf.estPdf(f)) ? window.LirePdf.texte(f)
      : (/\.docx$/i.test(f.name) ? lireDocx(f) : f.text())).then(function (t) {
      $("#depot").value = t;
      dit("<b>" + ech(f.name) + "</b> lu, " + t.length.toLocaleString("fr-FR") + " caractères. Le fichier n'est pas sorti de ce poste.");
    }).catch(function (e) {
      dit("<b>Ce fichier n'a pas pu être lu.</b>" + ech(e.message) + " Ouvrez le document, copiez son texte et collez-le ci-dessous.", "att");
    });
  });

  $("#controler").addEventListener("click", function () {
    var txt = $("#depot").value, cible = $("#diagnostic");
    if (txt.trim().length < 40) {
      cible.innerHTML = '<div class="avis att"><b>Le texte déposé est trop court.</b>' +
        "Déposez le texte de toutes vos affiches : sur un extrait, tout ce qui n'y figure pas serait dit absent.</div>";
      return;
    }
    /* Les trois indices que D. 4711-1 fait chercher : une adresse se reconnaît
       à son code postal, un numéro d'appel à ses chiffres groupés, une personne
       à sa civilité ou à son titre. */
    var INDICE = {
      adresse: /\b\d{5}\b\s*[A-Za-zÀ-ÿ]/,
      telephone: /(?:\+33|0)\s*\d(?:[\s.\-]?\d{2}){4}/,
      personne: /\b(Madame|Monsieur|Mme|M\.|Docteur|Dr)\s+[A-ZÀ-Þ]/,
    };
    var plat = sansAccents(txt), manques = 0, h = "";
    AFFICHES.forEach(function (a) {
      /* UNE AFFICHE SANS ÉLÉMENT ATTENDU N'EST PAS UNE AFFICHE TROUVÉE.
         Sans ligne dans ce tableau, la boucle ne trouvait rien d'absent et
         concluait « Trouvé » : c'est ainsi que la consigne incendie passait dans
         un texte qui ne parlait que de fumer. Le 28 septembre 2026. */
      var att = (ATTENDUS[a.id] || []).filter(function (x) {
        if (x.si !== "referent") return true;
        return (avecComite || !comiteDit) || effectif === null || effectif >= 250;
      });
      var absents = [];
      att.forEach(function (x) {
        var ok;
        if (x.ou) ok = INDICE[x.ou].test(txt);
        else ok = (x.mots || []).some(function (m) { return plat.indexOf(sansAccents(m)) >= 0; });
        if (!ok) absents.push(x.objet);
      });
      var trouve = att.length > 0 && !absents.length;
      if (!att.length) absents.push("aucun élément de cette affiche n'est contrôlable sur les mots : lisez-la vous-même");
      if (trouve) E.faites[a.id] = true; else { manques++; delete E.faites[a.id]; }
      h += '<div class="manque' + (trouve ? " trouve" : "") + '"><div class="o">' + ech(a.nom) + "</div>" +
        (trouve
          ? '<p class="note" style="margin:6px 0 0">Trouvé dans votre texte. La recherche voit que le sujet est traité, elle ne dit jamais qu\'il l\'est bien.</p>'
          : '<p class="note" style="margin:6px 0 0">Introuvable : ' + ech(absents.join(" ; ")) + ".</p>" +
            '<div class="barre pile"><button type="button" class="btn" data-ouvre="' + ech(a.id) + '">L\'affiche, prête à poser</button></div>') +
        "</div>";
    });
    garder();
    cible.innerHTML = '<div class="avis ' + (manques ? "att" : "ok") + '"><b>' +
      /* Le pluriel entre parenthèses est proscrit : on l'accorde. Le
         28 septembre 2026. */
      (manques
        ? manques + (manques > 1 ? " affichages introuvables" : " affichage introuvable") + " dans votre texte"
        : "Les onze affichages sont trouvés") +
      "</b>La recherche est faite sur les mots : c'est votre lecture qui décide.</div>" + h;
    cible.scrollIntoView({ behavior: "smooth" });
  });

  /* -------------------------------------------------------- le relevé */
  var CHAMPS_RELEVE = [
    { c: "dateReleve", n: "Date du relevé", t: "date" },
    { c: "relLieux", n: "Lieux parcourus", large: true, ph: "chaque site, chaque atelier, chaque local d'embauche" },
    { c: "relAuteur", n: "Relevé effectué par", ph: "nom et qualité" },
    { c: "relSupport", n: "Support de l'information due par tout moyen", large: true,
      ph: "affichage papier, intranet, livret remis à l'embauche, courriel nominatif" },
    { c: "condComment", n: "Conducteurs : comment l'information leur parvient", large: true,
      ph: "remise en main propre à la prise de service, livret de bord, courriel nominatif" },
    { c: "condPreuve", n: "Conducteurs : ce qui le prouve", large: true,
      ph: "émargement, accusé de réception, capture datée" },
    { c: "condNb", n: "Nombre de conducteurs concernés", t: "number" },
    { c: "condLe", n: "Dernière diffusion aux conducteurs", t: "date" },
  ];

  function rendreReleve() {
    $("#champs-releve").innerHTML = CHAMPS_RELEVE.map(champHtml).join("");
    brancherChamps($("#champs-releve"), tableauReleve);
    tableauReleve();
  }

  /* LA PHOTO DATÉE, ET PAS SEULEMENT LA PHRASE QUI DIT QU'ELLE EXISTE.
     Le relevé affirmait qu'une photographie était jointe à chaque emplacement ;
     rien ne permettait de la joindre. Elle se dépose ici, elle entre dans
     « Mes documents » sous la rubrique des affichages, et le relevé porte son
     nom et sa date. Relevé le 26 septembre 2026. */
  function photoDe(id) {
    var n = v("photo-" + id), d = v("photoLe-" + id);
    if (!n) return null;
    return { nom: n, le: d };
  }
  function direPhoto(id) {
    var ph = photoDe(id);
    return ph ? ("photographie « " + ph.nom + " »" + (ph.le ? ", du " + dateFr(ph.le) : ", sans date"))
              : "aucune photographie déposée";
  }

  function tableauReleve() {
    var lignes = AFFICHES.map(function (a) {
      var f = !!E.faites[a.id];
      var ph = photoDe(a.id);
      /* LA LISTE SE COCHE, ELLE NE SE LIT PAS.
         « en place » ou « à poser » s'affichait sans qu'on puisse rien cocher :
         l'employeur qui répond « oui, mes affichages sont en place » n'avait
         d'autre entrée que le dépôt d'un fichier qu'il n'a pas. Une case par
         affiche, ici, avec son emplacement, sa date et sa photographie. Ajouté
         le 28 septembre 2026 sur la contre-vérification du 26. */
      return '<div class="releve-ligne"><div class="n">' +
        '<label class="coche"><input type="checkbox" data-coche="' + ech(a.id) + '"' +
        (f ? " checked" : "") + '> ' + ech(a.nom) + "</label></div>" +
        '<div class="e' + (f ? " fait" : "") + '">' + (f ? "en place" : "à poser") + " · " +
        (a.fond.length ? ech(a.fond.join(", ")) : "code de la santé publique") + "</div>" +
        '<div class="deux"><input data-rel="lieu-' + ech(a.id) + '" value="' + ech(v("lieu-" + a.id)) + '" placeholder="emplacement exact">' +
        '<input data-rel="date-' + ech(a.id) + '" type="date" value="' + ech(v("date-" + a.id)) + '"></div>' +
        '<div class="photo"><label class="pj"><span>' +
        (ph ? "Remplacer la photographie" : "Joindre une photographie datée") + "</span>" +
        '<input type="file" accept="image/*" data-photo="' + ech(a.id) + '"></label>' +
        '<span class="pj-dit">' + ech(direPhoto(a.id)) + "</span></div></div>";
    }).join("");

    $("#releve").innerHTML =
      '<div class="a4">' + enTete() +
      "<h1>RELEVÉ DES AFFICHAGES</h1>" +
      '<p class="sous">Constat daté de ce qui est apposé dans l\'établissement</p>' +
      '<div class="cle"><span>Date du relevé</span><span' + (v("dateReleve") ? "" : ' class="vide"') + ">" +
      ech(dateFr(v("dateReleve")) || "[ date à porter ]") + "</span></div>" +
      '<div class="cle"><span>Lieux parcourus</span><span' + (v("relLieux") ? "" : ' class="vide"') + ">" +
      ech(v("relLieux") || "[ lieux à indiquer ]") + "</span></div>" +
      '<div class="cle"><span>Relevé effectué par</span><span' + (v("relAuteur") ? "" : ' class="vide"') + ">" +
      ech(v("relAuteur") || v("responsable") || "[ nom et qualité ]") + "</span></div>" +
      '<div class="cle"><span>Support de l\'information</span><span' + (v("relSupport") ? "" : ' class="vide"') + ">" +
      ech(v("relSupport") || "[ support à indiquer ]") + "</span></div>" +
      "<h2>Ce qui a été constaté, affichage par affichage</h2>" + lignes +
      /* LES CONDUCTEURS NE PASSENT PAS DEVANT LE PANNEAU.
         Un affichage dans les locaux n'atteint pas un roulant qui prend son
         camion le lundi et rentre le vendredi : la question n'est pas de
         savoir si l'affiche est posée, mais comment l'information lui est
         parvenue, et ce qui le prouve. Relevé le 26 septembre 2026. */
      "<h2>Les conducteurs</h2>" +
      '<p class="note">Un affichage dans les locaux n\'atteint pas un conducteur qui part le lundi et rentre le vendredi. ' +
      "Pour eux, l'information passe autrement, et c'est ce passage qui se prouve.</p>" +
      '<div class="cle"><span>Comment l\'information leur parvient</span><span' + (v("condComment") ? "" : ' class="vide"') + ">" +
      ech(v("condComment") || "[ remise en main propre, livret, courriel nominatif, application de bord : à indiquer ]") + "</span></div>" +
      '<div class="cle"><span>Ce qui le prouve</span><span' + (v("condPreuve") ? "" : ' class="vide"') + ">" +
      ech(v("condPreuve") || "[ émargement, accusé de réception, capture datée : à indiquer ]") + "</span></div>" +
      '<div class="cle"><span>Conducteurs concernés</span><span' + (v("condNb") ? "" : ' class="vide"') + ">" +
      ech(v("condNb") || "[ nombre à indiquer ]") + "</span></div>" +
      '<div class="cle"><span>Dernière diffusion</span><span' + (v("condLe") ? "" : ' class="vide"') + ">" +
      ech(dateFr(v("condLe")) || "[ date à porter ]") + "</span></div>" +
      '<p class="note" style="margin-top:12px">Une photographie datée de chaque emplacement est jointe au présent relevé : ' +
      "elle est déposée en face de chaque affichage ci-dessus, et conservée dans « Mes documents ». " +
      "Pour ce qui est dû par tout moyen, la preuve du support en tient lieu : accusé de diffusion, " +
      "capture de l'intranet, émargement du livret d'accueil.</p>" +
      '<div class="signature">Date et signature</div>' +
      "</div>";

    $("#releve").querySelectorAll("[data-rel]").forEach(function (i) {
      i.addEventListener("input", function () { E.v[i.getAttribute("data-rel")] = i.value; garder(); });
    });
    /* La photographie : son nom et sa date sont gardés avec le relevé, le
       fichier lui-même entre dans « Mes documents ». Si la base des documents
       ne répond pas, le nom reste et l'écran le dit : on ne perd pas le
       constat parce que le stockage a refusé. */
    $("#releve").querySelectorAll("[data-photo]").forEach(function (i) {
      i.addEventListener("change", function () {
        var id = i.getAttribute("data-photo");
        var f = i.files && i.files[0];
        if (!f) return;
        E.v["photo-" + id] = f.name;
        E.v["photoLe-" + id] = new Date().toISOString().slice(0, 10);
        garder();
        var dit = i.parentNode.parentNode.querySelector(".pj-dit");
        if (dit) dit.textContent = direPhoto(id);
        if (!window.Documents) return;
        var nom = AFFICHES.filter(function (a) { return a.id === id; })[0];
        window.Documents.enregistrer("affichages", {
          nom: f.name, sorte: "depose", type: f.type || "",
          note: "Photographie de l'affichage : " + (nom ? nom.nom : id),
          contenu: f,
        }).then(function () {
          if (dit) dit.textContent = direPhoto(id) + ", conservée dans Mes documents";
        }).catch(function () {
          if (dit) dit.textContent = direPhoto(id) + ", non conservée sur cet appareil";
        });
      });
    });
  }

  $("#imprimer-releve").addEventListener("click", function () { window.print(); });

  $("#word-releve").addEventListener("click", function () {
    var items = [
      { k: "sur", t: "Relevé daté des affichages · " + (v("denomination") || "") },
      { k: "p", t: "Date du relevé : " + (dateFr(v("dateReleve")) || "[ date ]") },
      { k: "p", t: "Lieux parcourus : " + (v("relLieux") || "[ lieux ]") },
      { k: "p", t: "Relevé effectué par : " + (v("relAuteur") || v("responsable") || "[ nom et qualité ]") },
      { k: "p", t: "Support de l'information due par tout moyen : " + (v("relSupport") || "[ support ]") },
      { k: "table", paysage: true,
        head: ["Affichage", "Fondement", "État", "Emplacement", "Posé le", "Photographie"],
        proportions: [26, 15, 11, 20, 12, 16],
        rows: AFFICHES.map(function (a) {
          return [a.nom, a.fond.length ? a.fond.join(", ") : "code de la santé publique",
            E.faites[a.id] ? "en place" : "à poser",
            v("lieu-" + a.id) || "", dateFr(v("date-" + a.id)) || "",
            v("photo-" + a.id) ? v("photo-" + a.id) + (v("photoLe-" + a.id) ? ", du " + dateFr(v("photoLe-" + a.id)) : "") : ""];
        }) },
      { k: "t1", t: "Les conducteurs" },
      { k: "p", t: "Un affichage dans les locaux n'atteint pas un conducteur qui part le lundi et rentre le vendredi. Pour eux, l'information passe autrement, et c'est ce passage qui se prouve." },
      { k: "p", t: "Comment l'information leur parvient : " + (v("condComment") || "[ à indiquer ]") },
      { k: "p", t: "Ce qui le prouve : " + (v("condPreuve") || "[ à indiquer ]") },
      { k: "p", t: "Conducteurs concernés : " + (v("condNb") || "[ nombre ]") },
      { k: "p", t: "Dernière diffusion : " + (dateFr(v("condLe")) || "[ date ]") },
      { k: "note", t: "Les photographies datées sont conservées dans « Mes documents », rubrique des affichages." },
      { k: "p", t: "Date et signature :" },
    ];
    window.AuditExport.telecharger(
      window.AuditExport.docx(items, "Relevé des affichages"),
      "releve-affichages-" + new Date().toISOString().slice(0, 10) + ".docx",
      "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  });

  /* ------------------------------------------------------------------ */
  /* L'ENTRÉE, SELON LA RÉPONSE.

     « non », rien n'est en place : les onze affiches, prêtes à poser.
     « oui », les affichages sont en place : la liste à cocher du relevé, avec
     l'emplacement, la date et la photographie de chacune. Le « oui » ouvrait le
     dépôt d'un fichier, alors qu'un employeur n'a jamais ses onze affichages
     réunis dans un document : c'est le mur qu'il faut relever, pas un texte à
     coller. Le dépôt reste accessible depuis le relevé pour qui a ce texte.
     Corrigé le 28 septembre 2026 sur la contre-vérification du 26. */
  var depart = new URLSearchParams(location.search).get("depart");
  if (depart === "non") { E.faites = {}; garder(); montrer("toutes", true); }
  else if (depart === "oui") montrer("releve", true);
  else montrer("depot", true);

  if ("serviceWorker" in navigator)
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
})();
</script>
<script src="assistant.js" defer></script>
