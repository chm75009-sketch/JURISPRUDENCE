<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit - Jurisprudence</title>
<meta name="description" content="Une ligne par obligation, oui ou non. Non : le document manquant est écrit pour vous. Oui : vous déposez le vôtre, il est contrôlé.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c2126">

<!--
  Écran 3 de la maquette validée le 8 septembre 2026 : une ligne par
  obligation, deux boutons sur la ligne. « Non » ouvre la page où le document
  se produit en zéro clic ; « Oui » ouvre le contrôle du document existant,
  ou, quand aucun contrôle n'existe, enregistre la réponse et passe la ligne
  en vert. Les obligations non dues à l'effectif sont en gris, sans bouton.

  Seuils lus au relais Légifrance le 8 septembre 2026, deux lectures espacées
  concordantes, filtre par nom du code :
  - L. 4121-3   LEGIARTI000043893923  évaluation des risques, tout employeur
  - L. 2311-2   LEGIARTI000035609353  comité social et économique, onze salariés
  - L. 1311-2   LEGIARTI000038610176  règlement intérieur, cinquante salariés
  - L. 2312-18  LEGIARTI000052437125  base de données économiques, sociales et environnementales
  - L. 1142-8   LEGIARTI000044605453  indicateurs d'égalité, cinquante salariés
  - L. 2242-1   LEGIARTI000043893962  négociations obligatoires, sections syndicales représentatives
  - L. 2143-3   LEGIARTI000052437195  délégué syndical, cinquante salariés
  - L. 1233-61  LEGIARTI000036261733  plan de sauvegarde de l'emploi, cinquante salariés
  - L. 2315-36  LEGIARTI000035626455  commission santé-sécurité, trois cents salariés
-->

<link rel="stylesheet" href="style.css">
<style>
  main.wrap{max-width:560px;padding-bottom:var(--e7)}
  .haut{display:flex;align-items:center;gap:12px;padding:14px 0 10px;border-bottom:1px solid var(--filet)}
  .haut a.retour{margin:0;font:600 15px system-ui;padding:10px 14px;border:1px solid var(--filet);
    border-radius:10px;background:var(--surface);color:var(--encre);text-decoration:none;min-height:44px;
    display:inline-flex;align-items:center;white-space:nowrap}
  .haut b{font-size:17px;color:var(--encre)}
  .haut span{color:var(--texte-2);font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .aide{margin:14px 0 4px;color:var(--texte-2);font-size:16px;max-width:none}
  .ligne{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--filet);min-height:64px}
  .ligne .nom{flex:1;font-size:18px;line-height:1.3;color:var(--encre)}
  .ligne .du{display:block;color:var(--texte-2);font-size:15px}
  .ligne .oui,.ligne .non,.ligne .vu{font:600 17px system-ui;min-width:74px;min-height:46px;padding:0 12px;
    border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
    text-decoration:none;white-space:nowrap;flex:none}
  .ligne .oui{border:2px solid var(--vert);background:var(--vert-clair);color:var(--vert)}
  .ligne .oui:hover{background:var(--vert);color:#fff;border-color:var(--vert)}
  .ligne .non{border:2px solid var(--accent);background:var(--accent);color:#fff}
  .ligne .non:hover{background:var(--accent-fonce);border-color:var(--accent-fonce);color:#fff}
  .ligne.pasdu{opacity:.55}
  .ligne.pasdu .nom{color:var(--texte-2)}
  .ligne.pasdu .du{display:inline;white-space:nowrap}
  .ligne.fait{background:var(--vert-clair);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:10px}
  .ligne.fait .nom{color:var(--vert)}
  .ligne .vu{border:2px solid var(--vert);background:var(--vert);color:#fff;cursor:pointer}
  .ligne .vu:hover{background:var(--vert-clair);color:var(--vert);border-color:var(--vert)}
  .ligne .vu::before{content:"\2713\00a0"}
  @media (max-width:420px){
    .ligne .nom{font-size:17px}
    .ligne .oui,.ligne .non,.ligne .vu{min-width:64px;padding:0 10px;font-size:16px}
  }
</style>
</head>
<body>

<div class="maj-dispo" id="maj-dispo">
  <div class="wrap">
    <span><b>Une nouvelle version est disponible.</b> Celle affichée date de votre dernière ouverture.</span>
    <button type="button" id="btn-maj">Recharger maintenant</button>
  </div>
</div>

<main class="wrap">

  <div class="haut">
    <a class="retour" href="index.html">&larr; Retour</a>
    <b>Audit</b>
    <span id="ent"></span>
  </div>

  <p class="aide">Non = le document rempli s'ouvre. Oui = vous déposez le vôtre, il est contrôlé.</p>

  <div id="liste"></div>

</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var profil = null;
  try { profil = JSON.parse(localStorage.getItem("profil-entreprise") || "null"); } catch (e) {}

  if (!profil || !profil.denomination) {
    /* Personne n'arrive ici sans être passé par la fiche. Un lien direct ou
       une fiche effacée entre-temps renvoie à la fiche, sans planter. */
    location.replace("index.html");
    return;
  }

  var eff = profil.effectif != null ? parseInt(profil.effectif, 10) : 0;
  if (isNaN(eff)) eff = 0;

  $("ent").textContent = profil.denomination + " · " + eff + " salarié" + (eff > 1 ? "s" : "");

  /* Une ligne par obligation. seuil : l'effectif à partir duquel elle est
     due. non : la page où le document se produit. oui : la page qui contrôle
     le document existant ; sans page de contrôle, « Oui » enregistre la
     réponse sur ce poste et la ligne passe en vert. */
  /* L'ORDRE : LES MODULES REPRIS D'ABORD.

     Le règlement intérieur, puis la base de données : les deux qui ouvrent
     le document, ses formalités une par une avec leur pièce, et le droit.
     Demande du 12 septembre 2026, la même que pour les vignettes des
     parcours. Les autres suivent dans leur ordre d'origine, et chacun
     remontera ici le jour où il sera repris. */
  var LIGNES = [
    { cle: "ri",         nom: "Règlement intérieur",  seuil: 50,  non: "parcours.html?p=ri&faire=1",           oui: "controler-ri.html" },
    { cle: "bdese",      nom: "Base de données (BDESE)",   seuil: 50,  non: "audit-bdese.html?rep=non",             oui: "controler-bdese.html" },
    { cle: "duerp",      nom: "Document unique (risques)",      seuil: 1,   non: "parcours.html?p=duerp&faire=1",        oui: "controler-duerp.html" },
    { cle: "affichages", nom: "Affichages obligatoires",        seuil: 1,   non: "parcours.html?p=affichages&faire=1",   oui: "controler-affichages.html" },
    { cle: "registre",   nom: "Registre du personnel",          seuil: 1,   non: "parcours.html?p=registre&faire=1" },
    { cle: "mutuelle",   nom: "Mutuelle d'entreprise",          seuil: 1,   non: "gerer.html" },
    { cle: "visites",    nom: "Visites médicales",         seuil: 1,   non: "gerer.html" },
    { cle: "cse",        nom: "Comité social et économique", seuil: 11, non: "parcours.html?p=installation&faire=1", oui: "controler-cse.html" },
    { cle: "egalite",    nom: "Égalité femmes-hommes", seuil: 50, non: "parcours.html?p=index&faire=1",        oui: "controler-egalite.html" },
    { cle: "nao",        nom: "Négociation annuelle (NAO)", seuil: 50, cond: "si délégué syndical", non: "parcours.html?p=nao&faire=1", oui: "controler-nao.html" },
    { cle: "pse",        nom: "Licenciement économique et PSE", seuil: 50, cond: "si projet de licenciement", non: "audit.html" },
    { cle: "cssct",      nom: "Commission santé-sécurité", seuil: 300, non: "parcours.html?p=commissions&faire=1" }
  ];

  var CLE_STOCK = "audit-vu";
  function lireVus() {
    try { return JSON.parse(localStorage.getItem(CLE_STOCK) || "{}") || {}; } catch (e) { return {}; }
  }
  function ecrireVus(v) {
    try { localStorage.setItem(CLE_STOCK, JSON.stringify(v)); } catch (e) {}
  }

  function rendre() {
    var vus = lireVus();
    var liste = $("liste");
    liste.textContent = "";
    LIGNES.forEach(function (l) {
      var du = eff >= l.seuil;
      var vu = du && !l.oui && !!vus[l.cle];
      var ligne = document.createElement("div");
      ligne.className = "ligne" + (du ? "" : " pasdu") + (vu ? " fait" : "");
      ligne.setAttribute("data-cle", l.cle);

      var nom = document.createElement("span");
      nom.className = "nom";
      nom.textContent = l.nom;
      if (du && l.cond) {
        var cond = document.createElement("span");
        cond.className = "du";
        cond.textContent = l.cond;
        nom.appendChild(cond);
      }
      ligne.appendChild(nom);

      if (!du) {
        var pas = document.createElement("span");
        pas.className = "du";
        pas.textContent = "pas dû avant " + l.seuil;
        ligne.appendChild(pas);
      } else if (vu) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "vu";
        b.textContent = "vu";
        b.title = "Annuler";
        b.addEventListener("click", function () {
          var v = lireVus();
          delete v[l.cle];
          ecrireVus(v);
          rendre();
        });
        ligne.appendChild(b);
      } else {
        if (l.oui) {
          var a = document.createElement("a");
          a.className = "oui";
          a.href = l.oui;
          a.textContent = "Oui";
          ligne.appendChild(a);
        } else {
          var o = document.createElement("button");
          o.type = "button";
          o.className = "oui";
          o.textContent = "Oui";
          o.addEventListener("click", function () {
            var v = lireVus();
            v[l.cle] = new Date().toISOString().slice(0, 10);
            ecrireVus(v);
            rendre();
          });
          ligne.appendChild(o);
        }
        var n = document.createElement("a");
        n.className = "non";
        n.href = l.non;
        n.textContent = "Non";
        ligne.appendChild(n);
      }
      liste.appendChild(ligne);
    });
  }
  rendre();

  /* Un rechargement forcé à la prise de main du nouveau service worker a été
     essayé (7.9) : il pouvait gagner la course contre un clic sur un lien en
     cours de navigation. Un bandeau, jamais un rechargement imposé. */
  if ("serviceWorker" in navigator) {
    var dejaControlee = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (dejaControlee) $("maj-dispo").classList.add("visible");
      dejaControlee = true;
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) { if (reg && reg.update) reg.update().catch(function () {}); }).catch(function () {});
    });
  }
  $("btn-maj").addEventListener("click", function () { location.reload(); });
})();
</script>
</body>
</html>
