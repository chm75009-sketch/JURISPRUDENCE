# Configuration Netlify.
#
# Le site est statique : rien à compiler. La « construction » se borne à copier
# les fichiers publiables dans dist/. Ce détour évite que le dossier des
# fonctions se retrouve à l'intérieur du dossier publié — situation que Netlify
# refuse — tout en gardant index.html à la racine du dépôt, comme l'exige
# GitHub Pages qui sert la même application.

[build]
  command = "mkdir -p dist && cp index.html manifest.json sw.js dist/ && cp -r icons dist/"
  publish = "dist"
  functions = "netlify/functions"

# Le relais n'a pas vocation à être indexé.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    X-Robots-Tag = "noindex"
